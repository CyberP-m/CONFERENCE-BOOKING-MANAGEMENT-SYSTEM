<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monomotapa Conference &amp; Events</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  @media print{
    .sidebar, .board-controls, .summary-controls, .toolbar, .no-print{display:none !important;}
    main{padding:0 !important;}
    body{background:#fff;}
    .card{border:none; box-shadow:none;}
  }
  :root{
    --ink:#111111; --ink-soft:#3D3D3D; --stone:#F7F3ED; --stone-deep:#D8C7A5; --panel:#FFFFFF;
    --teal:#3F6B4F; --teal-deep:#2C4D38; --gold:#C8872D; --gold-soft:#D8C7A5; --terracotta:#A8543A;
    --green:#3F6B4F; --slate:#6B6B6B; --line:#E4D9BF; --shadow: 0 1px 2px rgba(17,17,17,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--stone); color:var(--ink); font-family:'IBM Plex Sans', sans-serif; font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Fraunces', serif; color:var(--ink); margin:0;}
  .app{display:flex; min-height:100vh;}
  .sidebar{width:236px; flex:none; background:var(--teal-deep); color:#EFE9DA; display:flex; flex-direction:column; position:sticky; top:0; height:100vh;}
  .brand{padding:26px 22px 18px 22px;}
  .brand .mark{font-family:'Fraunces', serif; font-weight:600; font-size:21px; letter-spacing:0.02em; color:#F6EFDE;}
  .brand .sub{margin-top:4px; font-size:12px; color:#B9C9C0; letter-spacing:0.03em;}
  .chevrons{height:10px; width:100%;
    background:
      linear-gradient(135deg, transparent 46%, var(--gold) 46%, var(--gold) 54%, transparent 54%) 0 0/16px 16px,
      linear-gradient(45deg, transparent 46%, var(--gold) 46%, var(--gold) 54%, transparent 54%) 0 0/16px 16px;
    opacity:0.55;}
  nav.primary{padding:14px 12px; display:flex; flex-direction:column; gap:2px; flex:1;}
  nav.primary button{display:flex; align-items:center; gap:10px; text-align:left; background:transparent; border:none; color:#D8DED6; font-family:'IBM Plex Sans', sans-serif; font-size:13.5px; padding:10px 12px; border-radius:7px; cursor:pointer; transition:background .15s ease, color .15s ease; position:relative;}
  nav.primary button:hover{background:rgba(255,255,255,0.06); color:#fff;}
  nav.primary button.active{background:#274F45; color:#fff; font-weight:500; box-shadow:inset 3px 0 0 var(--gold);}
  nav.primary .ic{width:16px; text-align:center; opacity:0.85; font-size:14px;}
  .nav-badge{margin-left:auto; background:var(--gold); color:#241A0C; border-radius:20px; font-size:10.5px; font-weight:700; padding:1px 7px;}
  .sidebar-foot{padding:16px 20px 20px 20px; border-top:1px solid rgba(255,255,255,0.08);}
  .sidebar-foot button{width:100%; background:var(--gold); color:#241A0C; border:none; padding:10px 12px; border-radius:7px; font-weight:600; font-size:13.5px; cursor:pointer; font-family:'IBM Plex Sans', sans-serif;}
  .sidebar-foot button:hover{background:var(--gold-soft);}
  .sidebar-foot .hint{margin-top:10px; font-size:11px; color:#93A69C; line-height:1.5;}
  main{flex:1; min-width:0; padding:28px 34px 60px 34px;}
  .topbar{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:10px;}
  .topbar h1{font-size:24px; font-weight:600;}
  .topbar .meta{color:var(--slate); font-size:13px; margin-top:3px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow);}
  .kpis{display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:22px;}
  .kpi{padding:16px 18px;}
  .kpi .label{font-size:11.5px; color:var(--slate); text-transform:uppercase; letter-spacing:0.04em;}
  .kpi .value{font-family:'Fraunces', serif; font-size:26px; margin-top:6px; color:var(--teal-deep);}
  .kpi .sub{font-size:11.5px; color:var(--slate); margin-top:2px;}
  .grid2{display:grid; grid-template-columns:1.4fr 1fr; gap:16px;}
  .section-title{font-size:15px; font-weight:600; padding:14px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  .section-title small{font-weight:400; color:var(--slate); font-size:12px;}
  ul.plain{list-style:none; margin:0; padding:0;}
  .upcoming-item{display:flex; justify-content:space-between; align-items:center; padding:10px 18px; border-bottom:1px solid var(--line); font-size:13px;}
  .upcoming-item:last-child{border-bottom:none;}
  .upcoming-item .who{font-weight:500;}
  .upcoming-item .when{color:var(--slate); font-size:12px;}
  .util-row{display:flex; align-items:center; gap:10px; padding:9px 18px; font-size:12.5px;}
  .util-row .rn{width:150px; flex:none; color:var(--ink-soft);}
  .util-bar{flex:1; background:var(--stone-deep); border-radius:5px; height:8px; overflow:hidden;}
  .util-bar > div{height:100%; background:var(--teal); border-radius:5px;}
  .util-pct{width:38px; text-align:right; color:var(--slate);}
  .badge{display:inline-block; padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:600; letter-spacing:0.01em;}
  .badge.Tentative{background:#F3E4C7; color:#7A5620;}
  .badge.Confirmed{background:#DCEBE3; color:#1F4A38;}
  .badge.Completed{background:#E7E3DA; color:#565048;}
  .badge.Cancelled{background:#F1DAD3; color:#7C3823;}
  .board-controls{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .board-controls button.nav{background:var(--panel); border:1px solid var(--line); border-radius:7px; width:32px; height:32px; cursor:pointer; font-size:14px;}
  .board-controls .weeklabel{font-weight:600; font-family:'Fraunces',serif; font-size:16px; margin:0 6px;}
  .board-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--panel);}
  table.board{border-collapse:collapse; width:100%; min-width:820px;}
  table.board th{background:var(--stone-deep); font-size:12px; text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); border-right:1px solid var(--line); font-weight:600; color:var(--ink-soft);}
  table.board th .cap{display:block; font-weight:400; color:var(--slate); font-size:10.5px; margin-top:2px;}
  table.board td{border-bottom:1px solid var(--line); border-right:1px solid var(--line); vertical-align:top; padding:6px; min-width:150px; height:64px; cursor:pointer;}
  table.board td:hover{background:#FBF8F0;}
  table.board td.datecell{background:var(--stone); cursor:default; min-width:96px; font-size:12.5px; color:var(--ink-soft); font-weight:500;}
  table.board td.datecell .dow{display:block; font-size:10.5px; color:var(--slate); font-weight:400;}
  .chip{display:block; border-radius:6px; padding:4px 7px; font-size:11.5px; margin-bottom:4px; color:#fff; cursor:pointer; line-height:1.35; border-left:3px solid rgba(0,0,0,0.15);}
  .chip.Tentative{background:#B98A38;}
  .chip.Confirmed{background:#2F6B4F;}
  .chip.Completed{background:#7C7466;}
  .chip.Cancelled{background:#A8543A; text-decoration:line-through; opacity:0.75;}
  .chip .t{display:block; opacity:0.85; font-size:10.5px;}
  .toolbar{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center;}
  .toolbar input[type=text], .toolbar select{border:1px solid var(--line); background:var(--panel); border-radius:7px; padding:8px 10px; font-size:13px; font-family:inherit;}
  .toolbar input[type=text]{flex:1; min-width:180px;}
  table.list{width:100%; border-collapse:collapse; font-size:13px;}
  table.list th{text-align:left; padding:10px 12px; border-bottom:2px solid var(--line); color:var(--ink-soft); font-size:11.5px; text-transform:uppercase; letter-spacing:0.03em; white-space:nowrap;}
  table.list td{padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap;}
  table.list tr:hover td{background:#FBF8F0;}
  table.list .conflict{color:var(--terracotta); font-weight:600;}
  .rowbtn{background:none;border:none;cursor:pointer;color:var(--teal); font-size:12.5px; font-weight:600; padding:2px 4px;}
  .rowbtn.danger{color:var(--terracotta);}
  .empty-state{padding:50px 20px; text-align:center; color:var(--slate);}
  .empty-state .glyph{font-size:26px; margin-bottom:10px; color:var(--gold);}
  .overlay{position:fixed; inset:0; background:rgba(24,20,14,0.45); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; z-index:50;}
  .modal{background:var(--panel); border-radius:12px; width:100%; max-width:620px; box-shadow:0 12px 40px rgba(0,0,0,0.25); border:1px solid var(--line);}
  .modal-head{padding:18px 22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  .modal-head h2{font-size:18px;}
  .modal-head button{background:none;border:none;font-size:18px;cursor:pointer;color:var(--slate);}
  .modal-body{padding:20px 22px;}
  .formgrid{display:grid; grid-template-columns:1fr 1fr; gap:12px 14px;}
  .formgrid .full{grid-column:1/-1;}
  label{display:block; font-size:12px; color:var(--ink-soft); margin-bottom:5px; font-weight:500;}
  input, select, textarea{width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px; font-size:13px; font-family:inherit; background:#fff; color:var(--ink);}
  textarea{resize:vertical; min-height:56px;}
  .warn-box{background:#F7E9D8; border:1px solid #E4C48C; color:#7A5620; border-radius:8px; padding:10px 12px; font-size:12.5px; margin-top:6px;}
  .modal-foot{padding:16px 22px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  .btn{border:none; border-radius:7px; padding:9px 16px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit;}
  .btn.primary{background:var(--teal); color:#fff;}
  .btn.primary:hover{background:var(--teal-deep);}
  .btn.ghost{background:transparent; color:var(--terracotta);}
  .btn.secondary{background:var(--stone-deep); color:var(--ink);}
  .btn[disabled]{opacity:0.5; cursor:not-allowed;}
  .settings-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .room-row{display:flex; align-items:center; justify-content:space-between; padding:9px 18px; border-bottom:1px solid var(--line); font-size:13px;}
  .room-row:last-child{border-bottom:none;}
  .room-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; margin-bottom:18px;}
  .room-card{background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .room-card .art{height:96px; background:var(--stone-deep); display:flex; align-items:center; justify-content:center;}
  .room-card .art svg{width:100%; height:100%;}
  .room-card .info{padding:10px 12px;}
  .room-card .info .rname{font-weight:600; font-size:13px;}
  .room-card .info .rcap{color:var(--slate); font-size:11.5px; margin-top:2px;}
  .approval-item{padding:14px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;}
  .approval-item:last-child{border-bottom:none;}
  .approval-item .details{font-size:13px;}
  .approval-item .details .who{font-weight:600;}
  .approval-item .details .when{color:var(--slate); font-size:12px; margin-top:2px;}
  .approval-actions{display:flex; gap:8px; align-items:center;}
  .approval-actions input{width:150px;}
  .summary-controls{display:flex; gap:22px; align-items:center; margin-bottom:16px; flex-wrap:wrap;}
  .totals-strip{display:flex; gap:22px; padding:14px 18px; border-top:2px solid var(--line); font-size:13px; flex-wrap:wrap;}
  .totals-strip b{font-family:'Fraunces',serif; font-size:15px; color:var(--teal-deep);}
  .auth-gate{position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center; padding:20px;

    background-size:cover; background-position:center; background-repeat:no-repeat;}
  .auth-card{background:var(--panel); border-radius:14px; width:100%; max-width:380px; padding:30px 28px; box-shadow:0 20px 60px rgba(0,0,0,0.35);}
  .auth-card .mark{font-family:'Fraunces',serif; font-size:22px; font-weight:600; color:var(--teal-deep); text-align:center;}
  .auth-card .sub{text-align:center; color:var(--slate); font-size:12.5px; margin-top:2px; margin-bottom:22px;}
  .auth-card label{margin-top:12px;}
  .auth-card .btn{width:100%; margin-top:18px; padding:11px;}
  .auth-error{background:#F1DAD3; color:#7C3823; border-radius:7px; padding:9px 11px; font-size:12.5px; margin-top:14px;}
  .authed-as{display:flex; align-items:center; justify-content:space-between; padding:12px 20px; border-top:1px solid rgba(255,255,255,0.08); font-size:12.5px; color:#CBD6CF;}
  .authed-as button{background:none; border:none; color:var(--gold-soft); cursor:pointer; font-size:12px; font-weight:600;}
  .config-warning{max-width:460px; margin:16px auto 0; font-size:11.5px; color:#E8C79A; text-align:center; line-height:1.5;}
  @media (max-width: 980px){ .kpis{grid-template-columns:repeat(2,1fr);} .grid2{grid-template-columns:1fr;} .formgrid{grid-template-columns:1fr;} }
  @media (max-width: 720px){ .app{flex-direction:column;} .sidebar{width:100%; height:auto; position:relative;} nav.primary{flex-direction:row; overflow-x:auto;} main{padding:18px;} }

  /* ---- added: property photos ---- */
  .hero-banner{position:relative; border-radius:14px; overflow:hidden; margin-bottom:22px; height:190px; border:1px solid var(--line);}
  .hero-banner img{width:100%; height:100%; object-fit:cover; display:block;}
  .hero-banner-overlay{position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end; padding:20px 24px;
    background:linear-gradient(0deg, rgba(17,17,17,.75) 0%, rgba(17,17,17,.15) 55%, transparent 100%);}
  .hero-eyebrow{color:var(--gold); font-size:13px; font-weight:600; letter-spacing:0.03em;}
  .hero-title{font-family:'Fraunces', serif; color:#fff; font-size:28px; margin-top:2px;}
  .room-card .art img{width:100%; height:100%; object-fit:cover; display:block;}
  .gallery-strip{display:flex; gap:12px; overflow-x:auto; padding:14px 18px;}
  .gallery-thumb{position:relative; flex:none; width:150px; height:104px; border-radius:8px; overflow:hidden; border:1px solid var(--line); cursor:zoom-in;}
  .gallery-thumb img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .3s ease;}
  .gallery-thumb:hover img{transform:scale(1.08);}
  .lightbox-overlay{position:fixed; inset:0; z-index:300; display:flex; align-items:center; justify-content:center; padding:24px; background:rgba(17,17,17,.85); cursor:zoom-out;}
  .lightbox-overlay img{max-width:100%; max-height:100%; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,.4);}
  @media (max-width: 720px){ .hero-banner{height:150px;} .hero-title{font-size:22px;} }
</style>
</head>

<script>

const SUPABASE_URL = 'https://jrbdqfvsveklrxdjabwt.supabase.co';

const SUPABASE_ANON_KEY = 'sb_publishable_3xQL4gHD_veW5wN1ULtFug_9Q1FY5fU';

const sb = SUPABASE_URL.startsWith('http')
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

const DEFAULT_ROOMS_FALLBACK = [
  {id:1,name:'Great Indaba', capacity:200},{id:2,name:'Aquarium', capacity:80},{id:3,name:'Ophir', capacity:60},
  {id:4,name:'Conference Room 1', capacity:40},{id:5,name:'FR4', capacity:20},
  {id:6,name:'FR5', capacity:20},{id:7,name:'17 Boardroom', capacity:16},
  {id:8,name:'16 Mutapa Boardroom', capacity:16},{id:9,name:'16 Mutapa Conference', capacity:40},
];
/* Old names being renamed — used to auto-migrate any existing database rows */
const ROOM_RENAME_MAP = {'Conference Room 1 (NZC)':'Conference Room 1', 'FR4 Breakaway':'FR4', '17 Board Room':'17 Boardroom'};
const NEW_ROOMS_TO_ENSURE = [
  {name:'FR5', capacity:20},{name:'17 Boardroom', capacity:16},
  {name:'16 Mutapa Boardroom', capacity:16},{name:'16 Mutapa Conference', capacity:40},
];
const EVENT_TYPES = ['Conference','Workshop','Training','Meeting','Dinner','Wedding','Other'];
const STATUSES = ['Tentative','Confirmed','Completed','Cancelled'];
const PAYMENT_STATUSES = ['Pending','Invoiced','Purchase Order','Paid'];
const CURRENCIES = ['USD','ZWG'];
const NAV_ITEMS = [
  {id:'dashboard', label:'Dashboard', ic:'&#9673;'},
  {id:'board', label:'Booking board', ic:'&#9638;'},
  {id:'approvals', label:'Approvals', ic:'&#10003;'},
  {id:'list', label:'All bookings', ic:'&#9776;'},
  {id:'clients', label:'Clients', ic:'&#9822;'},
  {id:'summary', label:'Weekly summary', ic:'&#8981;'},
  {id:'settings', label:'Settings', ic:'&#9881;'},
];

let state = {
  bookings: [],
  rooms: DEFAULT_ROOMS_FALLBACK.map(r=>({...r})),
  clients: [],
  currentUser: null,
  currentUserId: null,
  currentUserRole: 'coordinator',
  view: 'dashboard',
  weekStart: mondayOf(new Date()),
  summaryWeekStart: mondayOf(new Date()),
  filters: {status:'All', room:'All', type:'All', search:''},
  clientFilters: {search:''},
  loaded:false,
  roomSetupIssues: null,
};

/* ---------------- Auth + data loading ---------------- */
async function init(){
  if(!sb){ state.loaded = true; render(); return; } // config not filled in yet — gate shows a warning
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ state.currentUser = session.user.user_metadata.full_name || session.user.email; await loadUserRole(session); }
  sb.auth.onAuthStateChange(async (event, session)=>{
    if(event==='SIGNED_IN'){ state.currentUser = session.user.user_metadata.full_name || session.user.email; await loadUserRole(session); }
    if(event==='SIGNED_OUT') { state.currentUser = null; state.currentUserRole='coordinator'; }
    render();
  });
  await loadAll();
}
async function loadUserRole(session){
  try{
    const uid = session.user.id;
    state.currentUserId = uid;
    let { data: profile } = await sb.from('profiles').select('*').eq('id', uid).maybeSingle();
    if(!profile){
      const insertRow = {id:uid, full_name: session.user.user_metadata.full_name || session.user.email, email: session.user.email, role:'coordinator'};
      const { data } = await sb.from('profiles').insert([insertRow]).select();
      profile = data && data[0];
    }
    state.currentUserRole = (profile && profile.role) || 'coordinator';
  } catch(e){ state.currentUserRole = 'coordinator'; }
}
async function loadAll(){
  if(sb && state.currentUser){
    const [{data:rooms}, {data:bookings}] = await Promise.all([
      sb.from('rooms').select('*').order('id'),
      sb.from('bookings').select('*').order('start_date'),
    ]);
    if(rooms) state.rooms = rooms;
    if(bookings) state.bookings = bookings;
    await migrateRoomsAndClients();
  }
  state.loaded = true;
  render();
}
async function ensureDefaultRooms(){
  const added = [], failed = [];
  for(const nr of NEW_ROOMS_TO_ENSURE){
    if(!state.rooms.find(r=>r.name.trim().toLowerCase()===nr.name.trim().toLowerCase())){
      if(sb){
        try{
          const {data, error} = await sb.from('rooms').insert([nr]).select();
          if(error){ failed.push({name:nr.name, error:error.message}); console.error('Could not add room', nr.name, error); }
          else if(data && data[0]){ state.rooms.push(data[0]); added.push(nr.name); }
        } catch(e){ failed.push({name:nr.name, error:e.message}); console.error('Could not add room', nr.name, e); }
      } else {
        state.rooms.push({id:'local-'+Date.now()+'-'+nr.name, ...nr});
        added.push(nr.name);
      }
    }
  }
  return {added, failed};
}
async function migrateRoomsAndClients(){
  // Rename any rooms still using the old names, and fix up bookings that reference them.
  for(const room of state.rooms){
    const renamed = ROOM_RENAME_MAP[room.name];
    if(renamed){
      const oldName = room.name;
      room.name = renamed;
      if(sb) await sb.from('rooms').update({name:renamed}).eq('id', room.id);
      const affected = state.bookings.filter(b=>b.room===oldName);
      for(const b of affected){
        b.room = renamed;
        if(sb) await sb.from('bookings').update({room:renamed}).eq('id', b.id);
      }
    }
  }
  // Add any newly-introduced rooms that aren't in the database yet.
  const {failed} = await ensureDefaultRooms();
  if(failed.length){ state.roomSetupIssues = failed; }
  // Ensure a clients table mirror exists in memory even if the table is empty/missing.
  if(sb){
    const {data:clients, error} = await sb.from('clients').select('*').order('name');
    if(!error && clients) state.clients = clients;
  }
}
async function saveRoomCapacity(id, capacity){
  const room = state.rooms.find(r=>r.id===id);
  if(room) room.capacity = capacity;
  if(sb) await sb.from('rooms').update({capacity}).eq('id', id);
}
async function insertBooking(draft){
  if(sb){
    const {data, error} = await sb.from('bookings').insert([draft]).select();
    if(error){ alert('Could not save: '+error.message); return; }
    state.bookings.push(data[0]);
  } else {
    draft.id = 'local-'+Date.now();
    state.bookings.push(draft);
  }
}
async function updateBooking(id, patch){
  const idx = state.bookings.findIndex(b=>b.id===id);
  if(idx>-1) state.bookings[idx] = {...state.bookings[idx], ...patch};
  if(sb){ const {error} = await sb.from('bookings').update(patch).eq('id', id); if(error) alert('Could not save: '+error.message); }
}
async function deleteBooking(id){
  state.bookings = state.bookings.filter(b=>b.id!==id);
  if(sb) await sb.from('bookings').delete().eq('id', id);
}
async function addRoom(name, capacity){
  const row = {name, capacity: Number(capacity)||0};
  if(sb){
    const {data, error} = await sb.from('rooms').insert([row]).select();
    if(error){ alert('Could not add room: '+error.message); return; }
    state.rooms.push(data[0]);
  } else {
    state.rooms.push({id:'local-'+Date.now(), ...row});
  }
}
async function deleteRoom(id){
  state.rooms = state.rooms.filter(r=>r.id!==id);
  if(sb) await sb.from('rooms').delete().eq('id', id);
}
async function saveRoomImage(id, dataUrl){
  const room = state.rooms.find(r=>r.id===id);
  if(room) room.image_url = dataUrl;
  if(sb) await sb.from('rooms').update({image_url:dataUrl}).eq('id', id);
}
async function upsertClient(client){
  const existing = state.clients.find(c=> (c.name||'').trim().toLowerCase() === (client.name||'').trim().toLowerCase());
  if(existing){
    const merged = {...existing, ...client};
    Object.assign(existing, merged);
    if(sb) await sb.from('clients').update(merged).eq('id', existing.id);
    return existing;
  } else {
    if(sb){
      const {data, error} = await sb.from('clients').insert([client]).select();
      if(!error && data){ state.clients.push(data[0]); return data[0]; }
    } else {
      const row = {id:'local-'+Date.now()+Math.random(), ...client};
      state.clients.push(row);
      return row;
    }
  }
}
async function deleteClient(id){
  state.clients = state.clients.filter(c=>c.id!==id);
  if(sb) await sb.from('clients').delete().eq('id', id);
}
async function saveProfileRole(id, role){
  if(sb) await sb.from('profiles').update({role}).eq('id', id);
}

/* ---------------- Helpers ---------------- */
function mondayOf(d){ const x=new Date(d); const day=x.getDay(); x.setDate(x.getDate()+(day===0?-6:1-day)); x.setHours(0,0,0,0); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function iso(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function fmtDate(d){ return d.toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'}); }
function fmtDateLong(d){ return d.toLocaleDateString('en-GB',{day:'numeric', month:'long', year:'numeric'}); }
function money(n, cur){ n = Number(n)||0; return (cur||'USD')+' '+n.toLocaleString(undefined,{minimumFractionDigits:0, maximumFractionDigits:2}); }
function roomCap(name){ const r = state.rooms.find(r=>r.name===name); return r? r.capacity : 0; }
function displayId(b){ return 'MNH-'+String(b.booking_no||0).padStart(4,'0'); }
function overlaps(aStart,aEnd,bStart,bEnd){ return aStart <= bEnd && bStart <= aEnd; }
function timeOverlap(aS,aE,bS,bE){ return aS < bE && bS < aE; }
function findConflicts(booking){
  return state.bookings.filter(b=>{
    if(b.id===booking.id) return false;
    if(b.room !== booking.room) return false;
    if(b.status==='Cancelled' || booking.status==='Cancelled') return false;
    if(!overlaps(booking.start_date, booking.end_date, b.start_date, b.end_date)) return false;
    return timeOverlap(booking.start_time||'00:00', booking.end_time||'23:59', b.start_time||'00:00', b.end_time||'23:59');
  });
}
function effectiveRate(b){ const disc = Number(b.discounted_rate)||0; return disc>0 ? disc : (Number(b.function_rate)||0); }
function functionRevenue(b){ return effectiveRate(b) * (Number(b.delegates)||0); }
function accommRevenue(b){ return (Number(b.accommodation_rate)||0) * (Number(b.nights)||0) * (Number(b.accommodation_delegates)||0); }
function isInWeek(b, weekStart){ const ws=iso(weekStart), we=iso(addDays(weekStart,6)); return overlaps(b.start_date, b.end_date, ws, we); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function openLightbox(src, alt){
  const ov = document.createElement('div');
  ov.className = 'lightbox-overlay';
  ov.innerHTML = `<img src="${src}" alt="${esc(alt||'Property photo')}">`;
  ov.addEventListener('click', ()=> ov.remove());
  document.addEventListener('keydown', function escClose(e){ if(e.key==='Escape'){ ov.remove(); document.removeEventListener('keydown', escClose); } });
  document.body.appendChild(ov);
}

function excelDateToISO(v){
  if(v==null || v==='') return '';
  if(v instanceof Date) return iso(v);
  if(typeof v === 'number'){ const d = XLSX.SSF.parse_date_code(v); if(d) return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`; }
  const s = String(v).trim();
  const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){ let [,a,b,y] = m; if(y.length===2) y = '20'+y; return `${y}-${String(b).padStart(2,'0')}-${String(a).padStart(2,'0')}`; }
  const m2 = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m2) return `${m2[1]}-${String(m2[2]).padStart(2,'0')}-${String(m2[3]).padStart(2,'0')}`;
  return '';
}
async function importBookingsFromFile(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array', cellDates:true});
  let imported = 0, skipped = 0;
  for(const sheetName of wb.SheetNames){
    const ws = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(ws, {defval:''});
    for(const row of rows){
      const get = (...keys)=>{ for(const k of keys){ for(const rk of Object.keys(row)){ if(rk.trim().toLowerCase()===k.toLowerCase()) return row[rk]; } } return ''; };
      const org = String(get('ORGANISATION','Client / Organisation','Client','Name')||'').trim();
      const startRaw = get('START','Event Date','Start Date');
      if(!org || !startRaw){ skipped++; continue; }
      const startISO = excelDateToISO(startRaw) || iso(new Date());
      const endRaw = get('END','End Date');
      const endISO = excelDateToISO(endRaw) || startISO;
      const timeStr = String(get('TIME')||'');
      let start_time='08:00', end_time='17:00';
      const tm = timeStr.match(/(\d{1,2}[:h]?\d{0,2}\s*[ap]?m?)\s*[-–to]+\s*(\d{1,2}[:h]?\d{0,2}\s*[ap]?m?)/i);
      if(tm){ start_time = tm[1].trim(); end_time = tm[2].trim(); }
      const roomName = String(get('VENUE','Room / Venue','Room')||'').trim();
      const matchedRoom = state.rooms.find(r=> r.name.toLowerCase() === roomName.toLowerCase()) || state.rooms.find(r=> roomName && r.name.toLowerCase().includes(roomName.toLowerCase()));
      const draft = {
        client: org,
        contact_person: String(get('CONTACT','Contact Person')||''),
        email: String(get('E-mail address','Email')||''),
        phone: String(get('CELL','Cell','Phone')||''),
        event_name: String(get('TYPE OF FUNCTION','Event','Conference / Event')||''),
        event_type: EVENT_TYPES.find(t=>t.toLowerCase()===String(get('TYPE OF FUNCTION')||'').toLowerCase()) || 'Conference',
        room: matchedRoom? matchedRoom.name : (state.rooms[0] && state.rooms[0].name),
        status: STATUSES.find(s=>s.toLowerCase()===String(get('STATUS')||'').toLowerCase()) || 'Tentative',
        start_date: startISO, end_date: endISO, start_time, end_time,
        delegates: parseInt(String(get('PAX','Delegates')||'0').replace(/[^0-9]/g,''))||0,
        currency: CURRENCIES.find(c=>c===String(get('CURRENCY')||'').toUpperCase()) || 'USD',
        function_rate: Number(get('FUNCTION RATE','Function Rate','Rate'))||0,
        discounted_rate: Number(get('DISCOUNTED RATE','Discounted Rate'))||0,
        accommodation_rate:0, nights:0, accommodation_delegates:0,
        payment_status: PAYMENT_STATUSES.find(s=>s.toLowerCase()===String(get('PAYMENT STATUS')||'').toLowerCase()) || 'Pending',
        handled_by: String(get('HANDLED BY')||''),
        notes: String(get('ACCOMMODATION')? 'Accommodation: '+get('ACCOMMODATION') : (get('NOTES')||'')),
      };
      await insertBooking(draft);
      await upsertClient({name: draft.client, contact_person: draft.contact_person, email: draft.email, phone: draft.phone});
      imported++;
    }
  }
  return {imported, skipped};
}

/* ---------------- Render root ---------------- */
function render(){
  renderAuthGate();
  if(!state.loaded || !state.currentUser){
    document.getElementById('main').innerHTML=''; document.getElementById('nav').innerHTML=''; return;
  }
  renderNav();
  const main = document.getElementById('main');
  if(state.view==='dashboard') renderDashboard(main);
  else if(state.view==='board') renderBoard(main);
  else if(state.view==='approvals') renderApprovals(main);
  else if(state.view==='list') renderList(main);
  else if(state.view==='clients') renderClients(main);
  else if(state.view==='summary') renderSummary(main);
  else if(state.view==='settings') renderSettings(main);
}
function renderNav(){
  const nav = document.getElementById('nav');
  const pending = state.bookings.filter(b=>b.status==='Tentative').length;
  nav.innerHTML = NAV_ITEMS.map(it=>`<button data-view="${it.id}" class="${state.view===it.id?'active':''}"><span class="ic">${it.ic}</span>${it.label}${it.id==='approvals'&&pending?`<span class="nav-badge">${pending}</span>`:''}</button>`).join('');
  nav.querySelectorAll('button').forEach(btn=> btn.onclick = ()=>{ state.view = btn.dataset.view; render(); });
}
function renderAuthGate(){
  const gate = document.getElementById('authGate');
  const authedAs = document.getElementById('authedAs');
  if(!state.loaded){ return; }

  if(!sb){
    authedAs.style.display='none'; gate.style.display='flex';
    gate.innerHTML = `<div class="auth-card"><div class="mark">MONOMOTAPA</div><div class="sub">Almost there</div>
      <p style="font-size:13px; color:var(--ink-soft);">This copy isn't connected to a database yet. Open this file, find the <code>SUPABASE_URL</code> / <code>SUPABASE_ANON_KEY</code> lines near the top of the script, and paste in the values from your Supabase project's API settings — see SETUP_GUIDE.md.</p></div>`;
    return;
  }

  if(state.currentUser){
    gate.style.display='none'; gate.innerHTML='';
    authedAs.style.display='flex';
    authedAs.innerHTML = `<span>Signed in as <b style="color:#fff;">${esc(state.currentUser)}</b></span><button id="signOutBtn">Sign out</button>`;
    document.getElementById('signOutBtn').onclick = async ()=>{ await sb.auth.signOut(); state.currentUser=null; render(); };
    return;
  }
  authedAs.style.display='none'; gate.style.display='flex';
  gate.innerHTML = `
    <div>
      <div class="auth-card">
        <div class="mark">MONOMOTAPA</div>
        <div class="sub">Sign in to the shared booking register</div>
        <label>Email</label><input type="email" id="loginEmail" autocomplete="username">
        <label>Password</label><input type="password" id="loginPassword" autocomplete="current-password">
        <button class="btn primary" id="loginBtn">Sign in</button>
        <div id="loginError"></div>
      </div>
    </div>`;
  const attempt = async ()=>{
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    document.getElementById('loginError').innerHTML = '';
    const {error} = await sb.auth.signInWithPassword({email, password});
    if(error) document.getElementById('loginError').innerHTML = `<div class="auth-error">${esc(error.message)}</div>`;
    else await loadAll();
  };
  document.getElementById('loginBtn').onclick = attempt;
  document.getElementById('loginPassword').addEventListener('keydown', e=>{ if(e.key==='Enter') attempt(); });
}

/* ---------------- Dashboard ---------------- */
function renderDashboard(main){
  const today = new Date(); const ws = mondayOf(today);
  const active = state.bookings.filter(b=>b.status!=='Cancelled');
  const thisWeek = active.filter(b=>isInWeek(b, ws));
  const confirmed = active.filter(b=>b.status==='Confirmed');
  const tentative = active.filter(b=>b.status==='Tentative');
  const monthKey = iso(today).slice(0,7);
  const thisMonth = active.filter(b=> (b.start_date||'').slice(0,7)===monthKey );
  const revenue = thisMonth.reduce((s,b)=>s+functionRevenue(b)+accommRevenue(b),0);
  const delegatesMonth = thisMonth.reduce((s,b)=>s+(Number(b.delegates)||0),0);
  const upcoming = active.filter(b=>b.start_date >= iso(today)).sort((a,b)=>a.start_date.localeCompare(b.start_date)).slice(0,6);
  const utilRows = state.rooms.map(r=>{
    const inWeek = thisWeek.filter(b=>b.room===r.name);
    const pct = inWeek.length ? Math.min(100, Math.round(inWeek.reduce((s,b)=>s+((Number(b.delegates)||0)/r.capacity*100),0)/inWeek.length)) : 0;
    return `<div class="util-row"><span class="rn">${esc(r.name)}</span><div class="util-bar"><div style="width:${pct}%"></div></div><span class="util-pct">${pct}%</span></div>`;
  }).join('');
  main.innerHTML = `

      <img src="${IMAGES.entranceWide}" alt="Monomotapa Hotel entrance">
      <div class="hero-banner-overlay">
        <div class="hero-eyebrow">Monomotapa Hotel</div>
        <div class="hero-title">Conference &amp; Banqueting</div>
      </div>
    </div>
    <div class="topbar"><div><h1>Dashboard</h1><div class="meta">${fmtDateLong(today)} · week of ${fmtDate(ws)}</div></div></div>
    <div class="kpis">
      <div class="card kpi"><div class="label">Total bookings</div><div class="value">${active.length}</div><div class="sub">all future &amp; past, excl. cancelled</div></div>
      <div class="card kpi"><div class="label">Confirmed</div><div class="value">${confirmed.length}</div><div class="sub">secured functions</div></div>
      <div class="card kpi"><div class="label">Tentative</div><div class="value">${tentative.length}</div><div class="sub">holds awaiting confirmation</div></div>
      <div class="card kpi"><div class="label">Delegates this month</div><div class="value">${delegatesMonth}</div><div class="sub">${today.toLocaleDateString('en-GB',{month:'long'})}</div></div>
      <div class="card kpi"><div class="label">Est. revenue this month</div><div class="value" style="font-size:20px;">${revenue.toLocaleString(undefined,{maximumFractionDigits:0})}</div><div class="sub">function + accommodation, mixed currency</div></div>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="section-title">Upcoming functions <small>next 6</small></div>
        <ul class="plain">
          ${upcoming.length? upcoming.map(b=>`<li class="upcoming-item"><div><div class="who">${esc(b.client||'Untitled')} — ${esc(b.event_name||b.event_type)}</div><div class="when">${esc(b.room)} · ${b.start_date}${b.start_time? ' · '+b.start_time+'–'+b.end_time:''}</div></div><span class="badge ${b.status}">${b.status}</span></li>`).join('') : '<div class="empty-state">Nothing booked yet — add your first function.</div>'}
        </ul>
      </div>
      <div class="card">
        <div class="section-title">Room utilisation <small>this week, by delegates vs. capacity</small></div>
        <div style="padding:8px 0;">${utilRows}</div>
      </div>
    </div>`;

    <div class="board-controls">

      <button class="btn secondary" id="thisWeek" style="margin-left:8px;">This week</button>
      <button class="btn secondary" id="exportBoardXlsx">Export week to Excel</button>

/* ---------------- Approvals ---------------- */
function renderApprovals(main){
  const pending = state.bookings.filter(b=>b.status==='Tentative').sort((a,b)=>a.start_date.localeCompare(b.start_date));
  main.innerHTML = `
    <div class="topbar"><div><h1>Approvals</h1><div class="meta">Tentative holds waiting to be confirmed or declined</div></div>
      ${pending.length? '<button class="btn secondary" id="exportApprovalsXlsx">Export to Excel</button>':''}
    </div>
    <div class="card">
      ${pending.length? pending.map(b=>{
        const conflicts = findConflicts(b);
        return `<div class="approval-item">
          <div class="details">
            <div class="who">${esc(b.client||'Untitled')} — ${esc(b.event_name||b.event_type)}</div>
            <div class="when">${esc(b.room)} · ${b.start_date}${b.start_time? ' · '+b.start_time+'–'+b.end_time:''} · ${b.delegates||0} delegates</div>
            ${conflicts.length? `<div class="when" style="color:var(--terracotta);">⚠ clashes with ${conflicts.map(c=>esc(c.client||c.event_name)).join(', ')}</div>`:''}
          </div>
          <div class="approval-actions">
            <input type="text" id="by-${b.id}" value="${esc(state.currentUser||'')}">
            <button class="btn primary" data-approve="${b.id}">Confirm</button>
            <button class="btn ghost" data-decline="${b.id}">Decline</button>
          </div>
        </div>`;
      }).join('') : `<div class="empty-state"><div class="glyph">&#10003;</div>Nothing waiting on approval right now.</div>`}
    </div>`;
  main.querySelectorAll('[data-approve]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.approve;
      const by = document.getElementById('by-'+id).value.trim() || 'Coordinator';
      await updateBooking(id, {status:'Confirmed', approved_by: by, approved_at: new Date().toISOString()});
      renderApprovals(main); renderNav();
    };
  });
  main.querySelectorAll('[data-decline]').forEach(btn=>{
    btn.onclick = async ()=>{ await updateBooking(btn.dataset.decline, {status:'Cancelled'}); renderApprovals(main); renderNav(); };
  });
  const exApprovalsBtn = document.getElementById('exportApprovalsXlsx');
  if(exApprovalsBtn) exApprovalsBtn.onclick = ()=>exportApprovalsExcel(pending);
}

/* ---------------- All bookings ---------------- */
function renderList(main){
  const f = state.filters;
  let rows = state.bookings.slice().sort((a,b)=> (a.start_date||'').localeCompare(b.start_date||''));
  if(f.status!=='All') rows = rows.filter(b=>b.status===f.status);
  if(f.room!=='All') rows = rows.filter(b=>b.room===f.room);
  if(f.type!=='All') rows = rows.filter(b=>b.event_type===f.type);
  if(f.search) rows = rows.filter(b=> (b.client+' '+b.event_name).toLowerCase().includes(f.search.toLowerCase()));
  main.innerHTML = `
    <div class="topbar"><div><h1>All bookings</h1><div class="meta">${rows.length} of ${state.bookings.length} shown</div></div></div>
    <div class="toolbar">
      <input type="text" id="fSearch" placeholder="Search client or event…" value="${esc(f.search)}">
      <select id="fStatus"><option value="All">All statuses</option>${STATUSES.map(s=>`<option ${f.status===s?'selected':''}>${s}</option>`).join('')}</select>
      <select id="fRoom"><option value="All">All rooms</option>${state.rooms.map(r=>`<option ${f.room===r.name?'selected':''}>${esc(r.name)}</option>`).join('')}</select>
      <select id="fType"><option value="All">All event types</option>${EVENT_TYPES.map(t=>`<option ${f.type===t?'selected':''}>${t}</option>`).join('')}</select>
      <button class="btn secondary" id="exportXlsx">Export to Excel</button>
      <button class="btn secondary" id="downloadTemplateBtn">Download import template</button>
      <button class="btn secondary" id="importXlsxBtn">Import from Excel</button>
      <input type="file" id="importXlsxInput" accept=".xlsx,.xls" style="display:none;">
    </div>
    <div class="card" style="overflow-x:auto;">
      ${rows.length? `<table class="list">
        <thead><tr><th>ID</th><th>Client</th><th>Event</th><th>Type</th><th>Room</th><th>Status</th><th>Date</th><th>Time</th><th>Delegates</th><th>Capacity %</th><th>Payment</th><th></th></tr></thead>
        <tbody>
          ${rows.map(b=>{
            const conflicts = findConflicts(b);
            const util = roomCap(b.room)? Math.round((Number(b.delegates)||0)/roomCap(b.room)*100) : 0;
            return `<tr>
              <td style="font-family:'IBM Plex Mono',monospace; font-size:12px;">${displayId(b)}</td>
              <td>${esc(b.client)}</td><td>${esc(b.event_name)}</td><td>${esc(b.event_type)}</td><td>${esc(b.room)}</td>
              <td><span class="badge ${b.status}">${b.status}</span></td>
              <td>${b.start_date}${b.end_date && b.end_date!==b.start_date ? ' → '+b.end_date : ''}</td>
              <td>${b.start_time||''}${b.start_time? '–'+b.end_time : ''}</td>
              <td>${b.delegates||0}</td>
              <td>${conflicts.length? `<span class="conflict">${util}% ⚠ clash</span>` : util+'%'}</td>
              <td>${esc(b.payment_status||'')}</td>
              <td><button class="rowbtn" data-edit="${b.id}">Edit</button> <button class="rowbtn danger" data-del="${b.id}">Delete</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>` : `<div class="empty-state"><div class="glyph">&#9723;</div>No bookings match these filters yet.</div>`}
    </div>`;
  document.getElementById('fSearch').oninput = e=>{ state.filters.search = e.target.value; renderList(main); };
  document.getElementById('fStatus').onchange = e=>{ state.filters.status = e.target.value; renderList(main); };
  document.getElementById('fRoom').onchange = e=>{ state.filters.room = e.target.value; renderList(main); };
  document.getElementById('fType').onchange = e=>{ state.filters.type = e.target.value; renderList(main); };

  document.getElementById('importXlsxBtn').onclick = ()=> document.getElementById('importXlsxInput').click();
  document.getElementById('importXlsxInput').onchange = async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    document.getElementById('importXlsxBtn').textContent = 'Importing…';
    try{
      const {imported, skipped} = await importBookingsFromFile(file);
      alert(`Import complete: ${imported} booking(s) added${skipped? ', '+skipped+' row(s) skipped (missing organisation or date)':''}.`);
    } catch(err){ alert('Could not import this file: '+err.message); }

  });
}

/* ---------------- Clients ---------------- */
function renderClients(main){
  const q = (state.clientFilters.search||'').toLowerCase();
  // Merge stored client records with any organisations only seen on bookings so far
  const known = new Map();
  state.clients.forEach(c=> known.set((c.name||'').toLowerCase(), {...c}));
  state.bookings.forEach(b=>{
    const key = (b.client||'').toLowerCase(); if(!key) return;
    if(!known.has(key)) known.set(key, {name:b.client, contact_person:b.contact_person, email:b.email, phone:b.phone});
  });
  let rows = Array.from(known.values()).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  if(q) rows = rows.filter(c=> (c.name+' '+(c.contact_person||'')+' '+(c.email||'')).toLowerCase().includes(q));
  main.innerHTML = `
    <div class="topbar"><div><h1>Clients</h1><div class="meta">${rows.length} organisation(s) on file</div></div></div>
    <div class="toolbar">
      <input type="text" id="cSearch" placeholder="Search client, contact or email…" value="${esc(state.clientFilters.search)}">
      <button class="btn primary" id="addClientBtn">+ Add client</button>
      <button class="btn secondary" id="exportClientsXlsx">Export to Excel</button>
    </div>
    <div class="card" style="overflow-x:auto;">
      ${rows.length? `<table class="list">
        <thead><tr><th>Organisation</th><th>Contact person</th><th>Email</th><th>Cell</th><th>Bookings</th><th></th></tr></thead>
        <tbody>
          ${rows.map(c=>{
            const count = state.bookings.filter(b=>(b.client||'').toLowerCase()===(c.name||'').toLowerCase()).length;
            return `<tr>
              <td>${esc(c.name)}</td><td>${esc(c.contact_person||'')}</td><td>${esc(c.email||'')}</td><td>${esc(c.phone||'')}</td><td>${count}</td>
              <td><button class="rowbtn" data-edit-client="${esc(c.name)}">Edit</button> ${c.id? `<button class="rowbtn danger" data-del-client="${c.id}">Delete</button>`:''}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>` : `<div class="empty-state"><div class="glyph">&#9822;</div>No clients on file yet — add one, or create a booking to add it automatically.</div>`}
    </div>`;
  document.getElementById('cSearch').oninput = e=>{ state.clientFilters.search = e.target.value; renderClients(main); };
  document.getElementById('exportClientsXlsx').onclick = exportClientsExcel;
  document.getElementById('addClientBtn').onclick = ()=>openClientModal(null);
  main.querySelectorAll('[data-edit-client]').forEach(b=> b.onclick = ()=>{
    const c = known.get(b.dataset.editClient.toLowerCase());
    openClientModal(c);
  });
  main.querySelectorAll('[data-del-client]').forEach(b=> b.onclick = async ()=>{
    if(confirm('Remove this client record? (Existing bookings are not affected.)')){ await deleteClient(b.dataset.delClient); renderClients(main); }
  });
}
function openClientModal(client){
  const c = client || {name:'', contact_person:'', email:'', phone:'', notes:''};
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head"><h2>${client? 'Edit client':'Add client'}</h2><button id="closeClientModal">&times;</button></div>
      <div class="modal-body"><div class="formgrid">
        <div class="full"><label>Organisation</label><input id="ccName" value="${esc(c.name)}" ${client? 'readonly':''}></div>
        <div><label>Contact person</label><input id="ccContact" value="${esc(c.contact_person||'')}"></div>
        <div><label>Email</label><input type="email" id="ccEmail" value="${esc(c.email||'')}"></div>
        <div><label>Cell</label><input id="ccPhone" value="${esc(c.phone||'')}"></div>
        <div class="full"><label>Notes</label><textarea id="ccNotes">${esc(c.notes||'')}</textarea></div>
      </div></div>
      <div class="modal-foot"><div></div><div style="display:flex; gap:8px;"><button class="btn secondary" id="ccCancel">Cancel</button><button class="btn primary" id="ccSave">Save</button></div></div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#closeClientModal').onclick = ()=>overlay.remove();
  overlay.querySelector('#ccCancel').onclick = ()=>overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#ccSave').onclick = async ()=>{
    const name = document.getElementById('ccName').value.trim();
    if(!name){ alert('Please add an organisation name.'); return; }
    await upsertClient({
      name, contact_person: document.getElementById('ccContact').value.trim(),
      email: document.getElementById('ccEmail').value.trim(), phone: document.getElementById('ccPhone').value.trim(),
      notes: document.getElementById('ccNotes').value.trim(),
    });
    overlay.remove();
    render();
  };
}

/* ---------------- Weekly summary ---------------- */
function renderSummary(main){
  const ws = state.summaryWeekStart;
  const rows = state.bookings.filter(b=>b.status!=='Cancelled' && isInWeek(b, ws)).sort((a,b)=>a.start_date.localeCompare(b.start_date));
  const totalCovers = rows.reduce((s,b)=>s+(Number(b.delegates)||0),0);
  const totalFuncRev = rows.reduce((s,b)=>s+functionRevenue(b),0);
  const totalAccRev = rows.reduce((s,b)=>s+accommRevenue(b),0);
  main.innerHTML = `
    <div class="topbar"><div><h1>Weekly summary</h1><div class="meta">Banqueting &amp; conference functions, by week</div></div></div>
    <div class="summary-controls">
      <div style="display:flex; align-items:center; gap:8px;"><button class="nav" id="pw">&larr;</button><span class="weeklabel">${fmtDate(ws)} – ${fmtDate(addDays(ws,6))}</span><button class="nav" id="nw">&rarr;</button></div>
      <button class="btn secondary" id="tw">This week</button>
      <button class="btn secondary no-print" id="exportSummaryXlsx" ${rows.length? '':'disabled'}>Export to Excel</button>
      <button class="btn secondary no-print" id="printSummary">Print / save as PDF</button>
    </div>
    <div class="card" style="overflow-x:auto;">
      ${rows.length? `<table class="list">
        <thead><tr><th>Name</th><th>Type</th><th>Covers</th><th>Venue</th><th>Time</th><th>Rate (actual/standard)</th><th>Discounted rate</th><th>Function revenue</th><th>Accomm. rate</th><th>Nights</th><th>Accomm. delegates</th><th>Accomm. revenue</th><th>Payment status</th></tr></thead>
        <tbody>
          ${rows.map(b=>`<tr>
            <td>${esc(b.client)}</td><td>${esc(b.event_type)}</td><td>${b.delegates||0}</td><td>${esc(b.room)}</td>
            <td>${b.start_time||''}${b.start_time? '–'+b.end_time:''}</td><td>${money(b.function_rate,b.currency)}</td>
            <td>${b.discounted_rate? money(b.discounted_rate,b.currency) : '—'}</td>
            <td>${money(functionRevenue(b),b.currency)}</td><td>${money(b.accommodation_rate,b.currency)}</td>
            <td>${b.nights||0}</td><td>${b.accommodation_delegates||0}</td><td>${money(accommRevenue(b),b.currency)}</td>
            <td>${esc(b.payment_status||'')}</td>
          </tr>`).join('')}
        </tbody>
      </table>
      <div class="totals-strip"><span>Functions: <b>${rows.length}</b></span><span>Total covers: <b>${totalCovers}</b></span><span>Function revenue: <b>${totalFuncRev.toLocaleString()}</b></span><span>Accommodation revenue: <b>${totalAccRev.toLocaleString()}</b></span></div>
      ` : `<div class="empty-state"><div class="glyph">&#9723;</div>No functions booked for this week.</div>`}
    </div>`;
  document.getElementById('pw').onclick=()=>{ state.summaryWeekStart = addDays(state.summaryWeekStart,-7); renderSummary(main); };
  document.getElementById('nw').onclick=()=>{ state.summaryWeekStart = addDays(state.summaryWeekStart,7); renderSummary(main); };
  document.getElementById('tw').onclick=()=>{ state.summaryWeekStart = mondayOf(new Date()); renderSummary(main); };
  const exBtn = document.getElementById('exportSummaryXlsx');
  if(exBtn && !exBtn.disabled) exBtn.onclick = ()=>exportSummaryExcel(rows, ws);
  document.getElementById('printSummary').onclick = ()=>window.print();
}

const NAMED_ROOM_IMAGES = {
  'Great Indaba': 'greatIndaba', 'Ophir': 'ophir',
  'Conference Room 1': 'conferenceRoom1', 'FR4': 'fr4',
};
function roomArt(room, i){
  if(room.image_url) return `<img src="${room.image_url}" alt="${esc(room.name)}">`;
  const namedKey = NAMED_ROOM_IMAGES[room.name];
  if(namedKey && IMAGES[namedKey]) return `<img src="${IMAGES[namedKey]}" alt="${esc(room.name)}">`;
  const palette = ['#3F6B4F','#C8872D','#111111','#8A6D3F','#5C7D68'];
  const c = palette[i % palette.length];
  const scenes = [
    `<g fill="none" stroke="${c}" stroke-width="2.2"><rect x="14" y="10" width="72" height="10" rx="2" fill="${c}" stroke="none" opacity="0.85"/>${[30,42,54,66,78].map(y=>`<line x1="14" y1="${y}" x2="86" y2="${y}"/>`).join('')}</g>`,
    `<g fill="none" stroke="${c}" stroke-width="2.4"><ellipse cx="50" cy="45" rx="30" ry="16" fill="${c}" opacity="0.15"/><ellipse cx="50" cy="45" rx="30" ry="16"/></g>`,
    `<g fill="none" stroke="${c}" stroke-width="2.4"><path d="M22 22 V64 H78 V22" /></g>`,
    `<g fill="none" stroke="${c}" stroke-width="2.4"><rect x="30" y="30" width="40" height="26" rx="4" fill="${c}" opacity="0.15"/><rect x="30" y="30" width="40" height="26" rx="4"/></g>`,
    `<g fill="none" stroke="${c}" stroke-width="2.2"><circle cx="34" cy="40" r="10" fill="${c}" opacity="0.15"/><circle cx="34" cy="40" r="10"/><circle cx="64" cy="55" r="10" fill="${c}" opacity="0.15"/><circle cx="64" cy="55" r="10"/></g>`,
  ];
  return `<svg viewBox="0 0 100 78" preserveAspectRatio="xMidYMid meet">${scenes[i % scenes.length]}</svg>`;
}

  };
  const retryBtn = document.getElementById('retryDefaultRooms');
  if(retryBtn) retryBtn.onclick = async ()=>{
    retryBtn.textContent = 'Retrying…';
    const {added, failed} = await ensureDefaultRooms();
    state.roomSetupIssues = failed.length? failed : null;
    if(added.length) alert('Added: '+added.join(', '));
    render();
  };
  main.querySelectorAll('[data-remove-room]').forEach(btn=> btn.onclick = async ()=>{
    const id = btn.dataset.removeRoom;
    const room = state.rooms.find(r=>String(r.id)===String(id));
    const inUse = state.bookings.some(b=> room && b.room===room.name);
    if(inUse && !confirm(`"${room.name}" still has bookings referencing it. Remove it from the room list anyway? Existing bookings will keep showing its name but it won't appear on the board or in new-booking pickers.`)) return;
    else if(!inUse && !confirm(`Remove "${room.name}" from the room list?`)) return;
    await deleteRoom(id);
    render();
  });
  main.querySelectorAll('[data-photo-for]').forEach(input=> input.onchange = async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{ await saveRoomImage(input.dataset.photoFor, reader.result); render(); };
    reader.readAsDataURL(file);
  });
  main.querySelectorAll('.gallery-thumb').forEach(t=> t.onclick = ()=> openLightbox(t.dataset.full, t.querySelector('img').alt));
  if(isAdmin) loadAndRenderUsersPanel();
}
async function loadAndRenderUsersPanel(){
  const body = document.getElementById('usersCardBody');
  if(!body) return;
  if(!sb){ body.innerHTML = 'Connect a database to manage users.'; return; }
  const { data: profiles, error } = await sb.from('profiles').select('*').order('full_name');
  const list = (!error && profiles) ? profiles : [];
  body.innerHTML = `
    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin-bottom:16px; padding-bottom:14px; border-bottom:1px solid var(--line);">
      <div style="flex:1; min-width:160px;"><label>Full name</label><input id="inviteName" placeholder="Jane Moyo"></div>
      <div style="flex:1; min-width:200px;"><label>Email</label><input type="email" id="inviteEmail" placeholder="jane@monomotapahotel.com"></div>
      <div style="width:140px;"><label>Role</label><select id="inviteRole"><option value="coordinator">Coordinator</option><option value="admin">Admin</option></select></div>
      <button class="btn primary" id="inviteBtn" style="height:37px;">Invite teammate</button>
    </div>
    ${list.length? `<table class="list" style="margin:-4px -8px 0 -8px; width:calc(100% + 16px);">
      <thead><tr><th>Name</th><th>Email</th><th>Role</th><th colspan="3"></th></tr></thead>
      <tbody>${list.map(p=>`<tr>
        <td>${esc(p.full_name||'')}</td><td>${esc(p.email||'')}</td>
        <td><select data-role-for="${p.id}"><option value="coordinator" ${p.role==='coordinator'?'selected':''}>Coordinator</option><option value="admin" ${p.role==='admin'?'selected':''}>Admin</option></select></td>
        <td><button class="rowbtn" data-save-role="${p.id}">Save role</button></td>
        <td><button class="rowbtn" data-reset-pw="${esc(p.email||'')}">Reset password</button></td>
        <td><button class="rowbtn danger" data-remove-user="${p.id}" data-remove-email="${esc(p.email||'')}">Remove access</button></td>
      </tr>`).join('')}</tbody>
    </table>` : `<div style="color:var(--slate); font-size:13px;">No coordinator profiles yet — they appear here automatically the first time someone signs in, or invite one above.</div>`}
    <div id="usersHint" style="font-size:12px; color:var(--slate); margin-top:10px;"></div>`;
  body.querySelectorAll('[data-save-role]').forEach(btn=> btn.onclick = async ()=>{
    const id = btn.dataset.saveRole;
    const role = body.querySelector(`[data-role-for="${id}"]`).value;
    await saveProfileRole(id, role);
    if(id === (state.currentUserId||'')) state.currentUserRole = role;
    alert('Role updated.');
  });
  body.querySelectorAll('[data-reset-pw]').forEach(btn=> btn.onclick = async ()=>{
    const email = btn.dataset.resetPw;
    if(!email){ alert('This profile has no email on file.'); return; }
    const { error } = await sb.auth.resetPasswordForEmail(email);
    alert(error? ('Could not send reset email: '+error.message) : `Password reset email sent to ${email}.`);
  });
  body.querySelectorAll('[data-remove-user]').forEach(btn=> btn.onclick = async ()=>{
    if(!confirm(`Remove login access for ${btn.dataset.removeEmail}? They will no longer be able to sign in.`)) return;
    const result = await callAdminUsersFunction('delete', {userId: btn.dataset.removeUser});
    if(result.ok){ alert('Access removed.'); loadAndRenderUsersPanel(); }
    else { showAdminFunctionHint(result.message); }
  });
  document.getElementById('inviteBtn').onclick = async ()=>{
    const full_name = document.getElementById('inviteName').value.trim();
    const email = document.getElementById('inviteEmail').value.trim();
    const role = document.getElementById('inviteRole').value;
    if(!email){ alert('Please add an email address.'); return; }
    const btn = document.getElementById('inviteBtn'); btn.textContent = 'Sending…';
    const result = await callAdminUsersFunction('invite', {email, full_name, role});
    btn.textContent = 'Invite teammate';
    if(result.ok){ alert(`Invite sent to ${email}.`); loadAndRenderUsersPanel(); }
    else { showAdminFunctionHint(result.message); }
  };
}
// Calls the "admin-users" Supabase Edge Function (see /supabase/functions/admin-users).
// That function holds the service-role key server-side — it is never exposed here —
// and only lets signed-in admins invite or remove a login.
async function callAdminUsersFunction(action, payload){
  try{
    const { data, error } = await sb.functions.invoke('admin-users', { body: { action, ...payload } });
    if(error) return { ok:false, message: error.message || 'The admin-users function returned an error.' };
    if(data && data.error) return { ok:false, message: data.error };
    return { ok:true, data };
  } catch(e){
    return { ok:false, message: e.message || 'Could not reach the admin-users function.' };
  }
}
function showAdminFunctionHint(message){
  const hint = document.getElementById('usersHint');
  const text = `${message} — this needs the "admin-users" Edge Function deployed once (see supabase/functions/admin-users in your project files, or ADMIN_SETUP.md for the two-command deploy).`;
  if(hint) hint.textContent = text; else alert(text);
}

/* ---------------- Booking modal ---------------- */
function openBookingModal(id, prefill){
  const editing = id ? state.bookings.find(b=>b.id===id) : null;
  const b = editing ? {...editing} : {
    id:null, client:'', contact_person:'', email:'', phone:'', event_name:'', event_type:'Conference', room:(prefill&&prefill.room)||state.rooms[0].name,
    status:'Tentative', start_date:(prefill&&prefill.start_date)||iso(new Date()), end_date:(prefill&&prefill.end_date)||(prefill&&prefill.start_date)||iso(new Date()),
    start_time:'08:00', end_time:'17:00', delegates:0, function_rate:0, discounted_rate:0, currency:'USD',
    accommodation_rate:0, nights:0, accommodation_delegates:0, payment_status:'Pending', handled_by:(state.currentUser||''), notes:''
  };
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head"><h2>${editing? 'Edit booking':'New booking'}</h2><button id="closeModal">&times;</button></div>
      <div class="modal-body"><div class="formgrid">
        <div><label>Client / organisation</label><input id="mClient" list="clientList" value="${esc(b.client)}"></div>
        <datalist id="clientList">${state.clients.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>
        <div><label>Conference / event name</label><input id="mEvent" value="${esc(b.event_name)}"></div>
        <div><label>Contact person</label><input id="mContact" value="${esc(b.contact_person||'')}"></div>
        <div><label>Contact email</label><input type="email" id="mEmail" value="${esc(b.email||'')}"></div>
        <div><label>Contact cell</label><input id="mPhone" value="${esc(b.phone||'')}"></div>
        <div><label>Handled by</label><input id="mHandledBy" value="${esc(b.handled_by||'')}"></div>
        <div><label>Event type</label><select id="mType">${EVENT_TYPES.map(t=>`<option ${b.event_type===t?'selected':''}>${t}</option>`).join('')}</select></div>
        <div><label>Room / venue</label><select id="mRoom">${state.rooms.map(r=>`<option ${b.room===r.name?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div>
        <div><label>Status</label><select id="mStatus">${STATUSES.map(s=>`<option ${b.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div><label>Payment status</label><select id="mPay">${PAYMENT_STATUSES.map(s=>`<option ${b.payment_status===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div><label>Event date</label><input type="date" id="mStart" value="${b.start_date}"></div>
        <div><label>End date</label><input type="date" id="mEnd" value="${b.end_date}"></div>
        <div><label>Start time</label><input type="time" id="mStime" value="${b.start_time}"></div>
        <div><label>End time</label><input type="time" id="mEtime" value="${b.end_time}"></div>
        <div><label>Delegates</label><input type="number" min="0" id="mDelegates" value="${b.delegates}"></div>
        <div><label>Currency</label><select id="mCur">${CURRENCIES.map(c=>`<option ${b.currency===c?'selected':''}>${c}</option>`).join('')}</select></div>
        <div><label>Function rate — actual/standard (per delegate)</label><input type="number" min="0" step="0.01" id="mRate" value="${b.function_rate}"></div>
        <div><label>Discounted rate (per delegate) <small style="font-weight:400;color:var(--slate);">leave 0 if no discount</small></label><input type="number" min="0" step="0.01" id="mDiscRate" value="${b.discounted_rate||0}"></div>
        <div><label>Accommodation rate (per night)</label><input type="number" min="0" step="0.01" id="mAccRate" value="${b.accommodation_rate}"></div>
        <div><label>Nights</label><input type="number" min="0" id="mNights" value="${b.nights}"></div>
        <div><label>Accommodation delegates</label><input type="number" min="0" id="mAccDel" value="${b.accommodation_delegates}"></div>
        <div class="full"><label>Notes</label><textarea id="mNotes">${esc(b.notes)}</textarea></div>
        <div class="full" id="conflictBox"></div>
      </div></div>
      <div class="modal-foot">
        <div>${editing? `<button class="btn ghost" id="deleteBtn">Delete booking</button>`:''}</div>
        <div style="display:flex; gap:8px;"><button class="btn secondary" id="cancelBtn">Cancel</button><button class="btn primary" id="saveBtn">${editing? 'Save changes':'Create booking'}</button></div>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  function readForm(){
    return {
      client: document.getElementById('mClient').value.trim(),
      contact_person: document.getElementById('mContact').value.trim(),
      email: document.getElementById('mEmail').value.trim(),
      phone: document.getElementById('mPhone').value.trim(),
      handled_by: document.getElementById('mHandledBy').value.trim(),
      event_name: document.getElementById('mEvent').value.trim(),
      event_type: document.getElementById('mType').value,
      room: document.getElementById('mRoom').value,
      status: document.getElementById('mStatus').value,
      payment_status: document.getElementById('mPay').value,
      start_date: document.getElementById('mStart').value,
      end_date: document.getElementById('mEnd').value || document.getElementById('mStart').value,
      start_time: document.getElementById('mStime').value,
      end_time: document.getElementById('mEtime').value,
      delegates: Number(document.getElementById('mDelegates').value)||0,
      currency: document.getElementById('mCur').value,
      function_rate: Number(document.getElementById('mRate').value)||0,
      discounted_rate: Number(document.getElementById('mDiscRate').value)||0,
      accommodation_rate: Number(document.getElementById('mAccRate').value)||0,
      nights: Number(document.getElementById('mNights').value)||0,
      accommodation_delegates: Number(document.getElementById('mAccDel').value)||0,
      notes: document.getElementById('mNotes').value,
    };
  }
  function checkConflicts(){
    const draft = {...readForm(), id: editing? b.id : null};
    const conflicts = findConflicts(draft);
    const box = document.getElementById('conflictBox');
    const cap = roomCap(draft.room);
    let html='';
    if(conflicts.length) html += `<div class="warn-box">Double-booking check: this clashes with ${conflicts.map(c=>esc(c.client||c.event_name)+' ('+c.start_time+'–'+c.end_time+')').join(', ')} in ${esc(draft.room)}.</div>`;
    if(cap && draft.delegates > cap) html += `<div class="warn-box">Delegates (${draft.delegates}) exceed ${esc(draft.room)}'s capacity of ${cap}.</div>`;
    box.innerHTML = html;
  }
  overlay.querySelectorAll('input,select,textarea').forEach(el=> el.addEventListener('input', checkConflicts));
  checkConflicts();

  overlay.querySelector('#closeModal').onclick = ()=>overlay.remove();
  overlay.querySelector('#cancelBtn').onclick = ()=>overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  const delBtn = overlay.querySelector('#deleteBtn');
  if(delBtn) delBtn.onclick = async ()=>{ if(confirm('Delete this booking permanently?')){ await deleteBooking(b.id); overlay.remove(); render(); } };
  overlay.querySelector('#saveBtn').onclick = async ()=>{
    const draft = readForm();
    if(!draft.client){ alert('Please add a client or organisation name.'); return; }
    if(editing){ await updateBooking(b.id, draft); }
    else { draft.created_by = state.currentUser; await insertBooking(draft); }
    await upsertClient({name: draft.client, contact_person: draft.contact_person, email: draft.email, phone: draft.phone});
    overlay.remove();
    render();
  };
}

document.getElementById('newBookingBtn').onclick = ()=>openBookingModal(null);
init();
</script>

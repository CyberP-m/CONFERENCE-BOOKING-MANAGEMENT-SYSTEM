<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monomotapa Conference &amp; Events</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          serif: ['Fraunces', 'serif'],
          sans: ['IBM Plex Sans', 'sans-serif'],
          mono: ['IBM Plex Mono', 'monospace'],
        },
        colors: {
          ink: '#111111',
          gold: '#c8872d',
          sand: '#d8c7a5',
          green: '#3f6b4f',
          ivory: '#f7f3ed',
        },
        boxShadow: {
          card: '0 1px 2px rgba(17,17,17,0.06)',
        },
      },
    },
  };
</script>
<style type="text/tailwindcss">
  @layer base {
    *{ box-sizing:border-box; }
    html,body{ margin:0; padding:0; }
    body{ @apply bg-ivory text-ink font-sans antialiased; font-size:14px; line-height:1.5; }
    h1,h2,h3,.display{ @apply font-serif text-ink; margin:0; }
    label{ @apply block text-xs text-ink/70 mb-1.5 font-medium; }
    input, select, textarea{ @apply w-full px-2.5 py-2 border border-sand/60 rounded-lg text-[13px] font-sans bg-white text-ink transition; }
    input:focus, select:focus, textarea:focus{ @apply outline-none ring-2 ring-gold/40 border-gold; }
    textarea{ resize:vertical; min-height:56px; }
  }

  @media print{
    .sidebar, .board-controls, .summary-controls, .toolbar, .no-print{ display:none !important; }
    main{ padding:0 !important; }
    body{ background:#fff; }
    .card{ border:none; box-shadow:none; }
  }

  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes modalIn{ from{ opacity:0; transform:translateY(8px) scale(.98); } to{ opacity:1; transform:translateY(0) scale(1); } }
  @keyframes lbIn{ from{ opacity:0; transform:scale(.96); } to{ opacity:1; transform:scale(1); } }

  @layer components {
    /* ---------- shell ---------- */
    .app{ @apply flex flex-col lg:flex-row min-h-screen; }
    .sidebar{ @apply w-full lg:w-[236px] flex-none bg-green text-[#EFE9DA] flex flex-col lg:sticky lg:top-0 lg:h-screen; }
    .brand{ @apply px-[22px] pt-[26px] pb-[18px]; }
    .brand .mark{ @apply font-serif font-semibold text-[21px] tracking-wide text-[#F6EFDE]; }
    .brand .sub{ @apply mt-1 text-xs text-[#B9C9C0] tracking-wide; }
    .chevrons{
      height:10px; width:100%; opacity:0.55;
      background:
        linear-gradient(135deg, transparent 46%, #c8872d 46%, #c8872d 54%, transparent 54%) 0 0/16px 16px,
        linear-gradient(45deg, transparent 46%, #c8872d 46%, #c8872d 54%, transparent 54%) 0 0/16px 16px;
    }
    nav.primary{ @apply px-3 py-3.5 flex flex-row lg:flex-col gap-0.5 flex-1 overflow-x-auto lg:overflow-visible; }
    nav.primary button{ @apply flex items-center gap-2.5 text-left bg-transparent border-none text-[#D8DED6] font-sans text-[13.5px] px-3 py-2.5 rounded-lg cursor-pointer whitespace-nowrap transition-colors duration-150 relative; }
    nav.primary button:hover{ @apply bg-white/10 text-white; }
    nav.primary button.active{ @apply text-white font-medium; background:rgba(0,0,0,0.18); box-shadow:inset 3px 0 0 0 #c8872d; }
    nav.primary .ic{ @apply w-4 text-center opacity-85 text-sm; }
    .nav-badge{ @apply ml-auto bg-gold text-[#241A0C] rounded-full text-[10.5px] font-bold px-[7px] py-[1px]; }
    .sidebar-foot{ @apply px-5 pt-4 pb-5 border-t border-white/10; }
    .sidebar-foot button{ @apply w-full bg-gold text-[#241A0C] border-none py-2.5 px-3 rounded-lg font-semibold text-[13.5px] cursor-pointer font-sans hover:bg-sand transition-colors; }
    .sidebar-foot .hint{ @apply mt-2.5 text-[11px] text-[#93A69C] leading-relaxed; }
    main{ @apply flex-1 min-w-0 px-4 sm:px-6 lg:px-[34px] pt-6 lg:pt-7 pb-[60px]; }

    /* ---------- auth ---------- */
    .auth-gate{ @apply fixed inset-0 z-[200] flex items-center justify-center p-5; background-size:cover; background-position:center; }
    .auth-scrim{ @apply absolute inset-0; background:linear-gradient(180deg, rgba(17,17,17,.55) 0%, rgba(17,17,17,.65) 45%, rgba(17,17,17,.9) 100%); }
    .auth-card{ @apply relative z-10 bg-white/97 rounded-2xl w-full max-w-[380px] p-[30px] shadow-2xl; animation:modalIn .25s ease; }
    .auth-card .mark{ @apply font-serif text-[22px] font-semibold text-ink text-center tracking-wide; }
    .auth-card .sub{ @apply text-center text-ink/60 text-[12.5px] mt-0.5 mb-[22px]; }
    .auth-card label{ @apply mt-3; }
    .auth-card .btn{ @apply w-full mt-[18px] py-[11px]; }
    .auth-error{ @apply bg-red-50 text-red-700 rounded-lg px-[11px] py-[9px] text-[12.5px] mt-[14px]; }
    .authed-as{ @apply flex items-center justify-between px-5 py-3 border-t border-white/10 text-[12.5px] text-[#CBD6CF]; }
    .authed-as button{ @apply bg-transparent border-none text-sand cursor-pointer text-xs font-semibold hover:text-gold transition-colors; }
    .config-warning{ @apply relative z-10 max-w-[460px] mx-auto mt-4 text-[11.5px] text-sand text-center leading-relaxed; }

    /* ---------- hero + gallery ---------- */
    .hero-banner{ @apply relative rounded-2xl overflow-hidden mb-6 h-[160px] sm:h-[210px] border border-sand/40; }
    .hero-banner img{ @apply w-full h-full object-cover; }
    .hero-banner-overlay{ @apply absolute inset-0 flex flex-col justify-end p-5 sm:p-6; background:linear-gradient(0deg, rgba(17,17,17,.75) 0%, rgba(17,17,17,.15) 55%, transparent 100%); }
    .hero-eyebrow{ @apply text-gold text-xs sm:text-[13px] font-semibold tracking-wide; }
    .hero-title{ @apply font-serif text-white text-2xl sm:text-[32px] leading-tight; }
    .gallery-strip{ @apply flex gap-3 overflow-x-auto p-4; }
    .gallery-thumb{ @apply relative rounded-lg overflow-hidden cursor-zoom-in flex-none w-[150px] h-[104px] border border-sand/50 group; }
    .gallery-thumb img{ @apply w-full h-full object-cover transition-transform duration-300 group-hover:scale-110; }
    .lightbox-overlay{ @apply fixed inset-0 z-[300] flex items-center justify-center p-6 cursor-zoom-out; background:rgba(17,17,17,.85); animation:fadeIn .15s ease; }
    .lightbox-overlay img{ @apply max-w-full max-h-full rounded-xl shadow-2xl; animation:lbIn .18s ease; }

    /* ---------- topbar / cards ---------- */
    .topbar{ @apply flex items-baseline justify-between mb-[22px] flex-wrap gap-2.5; }
    .topbar h1{ @apply text-2xl font-semibold; }
    .topbar .meta{ @apply text-ink/55 text-[13px] mt-[3px]; }
    .card{ @apply bg-white border border-sand/50 rounded-xl shadow-card; }
    .kpis{ @apply grid grid-cols-2 lg:grid-cols-5 gap-3.5 mb-[22px]; }
    .kpi{ @apply p-4 sm:p-[18px]; }
    .kpi .label{ @apply text-[11.5px] text-ink/55 uppercase tracking-wide; }
    .kpi .value{ @apply font-serif text-[26px] mt-1.5 text-green; }
    .kpi .sub{ @apply text-[11.5px] text-ink/55 mt-0.5; }
    .grid2{ @apply grid grid-cols-1 lg:grid-cols-[1.4fr_1fr] gap-4; }
    .section-title{ @apply text-[15px] font-semibold px-[18px] py-[14px] border-b border-sand/50 flex justify-between items-center; }
    .section-title small{ @apply font-normal text-ink/55 text-xs; }
    ul.plain{ @apply list-none m-0 p-0; }
    .upcoming-item{ @apply flex justify-between items-center px-[18px] py-2.5 border-b border-sand/40 text-[13px]; }
    .upcoming-item:last-child{ @apply border-b-0; }
    .upcoming-item .who{ @apply font-medium; }
    .upcoming-item .when{ @apply text-ink/55 text-xs; }
    .util-row{ @apply flex items-center gap-2.5 px-[18px] py-2 text-[12.5px]; }
    .util-row .rn{ @apply w-[150px] flex-none text-ink/75; }
    .util-bar{ @apply flex-1 bg-sand/30 rounded h-2 overflow-hidden; }
    .util-bar > div{ @apply h-full bg-green rounded; }
    .util-pct{ @apply w-[38px] text-right text-ink/55; }
    .badge{ @apply inline-block px-[9px] py-[3px] rounded-full text-[11.5px] font-semibold tracking-wide; }
    .badge.Tentative{ @apply bg-gold/15 text-[#7a541c]; }
    .badge.Confirmed{ @apply bg-green/15 text-green; }
    .badge.Completed{ @apply bg-ink/10 text-ink/60; }
    .badge.Cancelled{ @apply bg-red-50 text-red-700; }

    /* ---------- board ---------- */
    .board-controls{ @apply flex items-center gap-2.5 mb-[14px]; }
    .board-controls button.nav{ @apply bg-white border border-sand/50 rounded-lg w-8 h-8 cursor-pointer text-sm hover:bg-ivory transition-colors; }
    .board-controls .weeklabel{ @apply font-semibold font-serif text-base mx-1.5; }
    .board-wrap{ @apply overflow-x-auto border border-sand/50 rounded-xl bg-white; }
    table.board{ @apply border-collapse w-full min-w-[820px]; }
    table.board th{ @apply bg-ivory text-xs text-left px-3 py-2.5 border-b border-sand/50 border-r border-sand/50 font-semibold text-ink/75; }
    table.board th .cap{ @apply block font-normal text-ink/45 text-[10.5px] mt-0.5; }
    table.board td{ @apply border-b border-sand/40 border-r border-sand/40 align-top p-1.5 min-w-[150px] h-16 cursor-pointer; }
    table.board td:hover{ @apply bg-ivory; }
    table.board td.datecell{ @apply bg-ivory cursor-default min-w-[96px] text-[12.5px] text-ink/75 font-medium; }
    table.board td.datecell .dow{ @apply block text-[10.5px] text-ink/45 font-normal; }
    .chip{ @apply block rounded-md px-[7px] py-1 text-[11.5px] mb-1 text-white cursor-pointer leading-[1.35]; border-left:3px solid rgba(0,0,0,0.15); }
    .chip.Tentative{ @apply bg-gold; }
    .chip.Confirmed{ @apply bg-green; }
    .chip.Completed{ background:#736a5c; }
    .chip.Cancelled{ @apply bg-red-600 line-through opacity-75; }
    .chip .t{ @apply block opacity-85 text-[10.5px]; }

    /* ---------- toolbar / lists ---------- */
    .toolbar{ @apply flex gap-2.5 mb-[14px] flex-wrap items-center; }
    .toolbar input[type=text], .toolbar select{ @apply border border-sand/60 bg-white rounded-lg px-2.5 py-2 text-[13px] font-sans; }
    .toolbar input[type=text]{ @apply flex-1 min-w-[180px]; }
    table.list{ @apply w-full border-collapse text-[13px]; }
    table.list th{ @apply text-left px-3 py-2.5 border-b-2 border-sand/50 text-ink/70 text-[11.5px] uppercase tracking-wide whitespace-nowrap; }
    table.list td{ @apply px-3 py-2.5 border-b border-sand/40 whitespace-nowrap; }
    table.list tr:hover td{ @apply bg-ivory; }
    table.list .conflict{ @apply text-red-600 font-semibold; }
    .rowbtn{ @apply bg-transparent border-none cursor-pointer text-green text-[12.5px] font-semibold px-1 hover:underline; }
    .rowbtn.danger{ @apply text-red-600; }
    .empty-state{ @apply py-[50px] px-5 text-center text-ink/45; }
    .empty-state .glyph{ @apply text-2xl mb-2.5 text-gold; }

    /* ---------- modal ---------- */
    .overlay{ @apply fixed inset-0 bg-ink/50 flex items-start justify-center px-4 py-10 overflow-y-auto z-50; animation:fadeIn .15s ease; }
    .modal{ @apply bg-white rounded-2xl w-full max-w-[620px] shadow-2xl border border-sand/40; animation:modalIn .18s ease; }
    .modal-head{ @apply px-[22px] py-[18px] border-b border-sand/50 flex justify-between items-center; }
    .modal-head h2{ @apply text-lg font-serif; }
    .modal-head button{ @apply bg-transparent border-none text-lg cursor-pointer text-ink/50 hover:text-ink transition-colors; }
    .modal-body{ @apply px-[22px] py-5; }
    .formgrid{ @apply grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-[14px]; }
    .formgrid .full{ @apply col-span-full; }
    .warn-box{ @apply bg-gold/10 border border-gold/40 text-[#7a541c] rounded-lg px-3 py-2.5 text-[12.5px] mt-1.5; }
    .modal-foot{ @apply px-[22px] py-4 border-t border-sand/50 flex justify-between items-center flex-wrap gap-2; }
    .btn{ @apply border-none rounded-lg px-4 py-2.5 text-[13.5px] font-semibold cursor-pointer font-sans transition; }
    .btn.primary{ @apply bg-green text-white hover:brightness-[.92]; }
    .btn.ghost{ @apply bg-transparent text-red-600 hover:bg-red-50; }
    .btn.secondary{ @apply bg-sand/30 text-ink hover:bg-sand/50; }
    .btn[disabled]{ @apply opacity-50 cursor-not-allowed; }

    /* ---------- settings ---------- */
    .settings-grid{ @apply grid grid-cols-1 lg:grid-cols-2 gap-4; }
    .room-row{ @apply flex items-center justify-between px-[18px] py-2.5 border-b border-sand/40 text-[13px]; }
    .room-row:last-child{ @apply border-b-0; }
    .room-cards{ @apply grid gap-3.5 mb-[18px]; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); }
    .room-card{ @apply bg-white border border-sand/50 rounded-xl overflow-hidden hover:shadow-md transition-shadow; }
    .room-card .art{ @apply h-24 bg-ivory flex items-center justify-center overflow-hidden; }
    .room-card .art img{ @apply w-full h-full object-cover; }
    .room-card .art svg{ @apply w-full h-full; }
    .room-card .info{ @apply px-3 py-2.5; }
    .room-card .info .rname{ @apply font-semibold text-[13px]; }
    .room-card .info .rcap{ @apply text-ink/55 text-[11.5px] mt-0.5; }
    .approval-item{ @apply px-[18px] py-[14px] border-b border-sand/40 flex justify-between items-center gap-[14px] flex-wrap; }
    .approval-item:last-child{ @apply border-b-0; }
    .approval-item .details{ @apply text-[13px]; }
    .approval-item .details .who{ @apply font-semibold; }
    .approval-item .details .when{ @apply text-ink/55 text-xs mt-0.5; }
    .approval-actions{ @apply flex gap-2 items-center; }
    .approval-actions input{ @apply w-[150px]; }
    .summary-controls{ @apply flex gap-[22px] items-center mb-4 flex-wrap; }
    .totals-strip{ @apply flex gap-[22px] px-[18px] py-[14px] border-t-2 border-sand/50 text-[13px] flex-wrap; }
    .totals-strip b{ @apply font-serif text-[15px] text-green; }
  }
</style>
</head>
<body>
<div id="authGate" style="display:flex;" class="auth-gate">
  <div class="auth-scrim"></div>
  <div class="auth-card"><div class="mark">MONOMOTAPA</div><div class="sub">Loading the shared register&hellip;</div></div>
</div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">MONOMOTAPA</div>
      <div class="sub">Conference &amp; Banqueting</div>
    </div>
    <div class="chevrons"></div>
    <nav class="primary" id="nav"></nav>
    <div class="sidebar-foot">
      <button id="newBookingBtn">+ New booking</button>
      <div class="hint">Shared register, backed by a real database &mdash; every coordinator sees the same live data.</div>
    </div>
    <div class="authed-as" id="authedAs"></div>
  </aside>
  <main id="main"></main>
</div>

<script>
/* =====================================================================
   SETUP — fill these in once you've created your Supabase project.
   Dashboard -> Project settings -> API -> "Project URL" and "anon public" key.
   These two values are meant to be public (they're safe to ship in a
   front-end file) — real protection comes from the database policies
   in schema.sql, not from hiding this key.
   ===================================================================== */
const SUPABASE_URL = 'https://jrbdqfvsveklrxdjabwt.supabase.co';

const SUPABASE_ANON_KEY = 'sb_publishable_3xQL4gHD_veW5wN1ULtFug_9Q1FY5fU';

/* ===================================================================== */

const sb = SUPABASE_URL.startsWith('http')
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

const DEFAULT_ROOMS_FALLBACK = [
  {id:1,name:'Great Indaba', capacity:200},{id:2,name:'Aquarium', capacity:80},{id:3,name:'Ophir', capacity:60},
  {id:4,name:'Conference Room 1 (NZC)', capacity:40},{id:5,name:'FR4 Breakaway', capacity:20},
];
const EVENT_TYPES = ['Conference','Workshop','Training','Meeting','Dinner','Wedding','Other'];
const STATUSES = ['Tentative','Confirmed','Completed','Cancelled'];
const PAYMENT_STATUSES = ['Pending','Invoiced','Purchase Order','Paid'];
const CURRENCIES = ['USD','ZWG'];
const NAV_ITEMS = [
  {id:'dashboard', label:'Dashboard', ic:'&#9673;'},
  {id:'board', label:'Booking board', ic:'&#9638;'},
  {id:'approvals', label:'Approvals', ic:'&#10003;'},
  {id:'list', label:'All bookings', ic:'&#9776;'},
  {id:'summary', label:'Weekly summary', ic:'&#8981;'},
  {id:'settings', label:'Settings', ic:'&#9881;'},
];

let state = {
  bookings: [],
  rooms: DEFAULT_ROOMS_FALLBACK.map(r=>({...r})),
  currentUser: null,
  view: 'dashboard',
  weekStart: mondayOf(new Date()),
  summaryWeekStart: mondayOf(new Date()),
  filters: {status:'All', room:'All', type:'All', search:''},
  loaded:false,
};

/* ---------------- Auth + data loading ---------------- */
async function init(){
  if(!sb){ state.loaded = true; render(); return; } // config not filled in yet — gate shows a warning
  const { data:{ session } } = await sb.auth.getSession();
  if(session) state.currentUser = session.user.user_metadata.full_name || session.user.email;
  sb.auth.onAuthStateChange((event, session)=>{
    if(event==='SIGNED_IN') state.currentUser = session.user.user_metadata.full_name || session.user.email;
    if(event==='SIGNED_OUT') state.currentUser = null;
    render();
  });
  await loadAll();
}
async function loadAll(){
  if(sb && state.currentUser){
    const [{data:rooms}, {data:bookings}] = await Promise.all([
      sb.from('rooms').select('*').order('id'),
      sb.from('bookings').select('*').order('start_date'),
    ]);
    if(rooms) state.rooms = rooms;
    if(bookings) state.bookings = bookings;
  }
  state.loaded = true;
  render();
}
async function saveRoomCapacity(id, capacity){
  const room = state.rooms.find(r=>r.id===id);
  if(room) room.capacity = capacity;
  if(sb) await sb.from('rooms').update({capacity}).eq('id', id);
}
async function insertBooking(draft){
  if(sb){
    const {data, error} = await sb.from('bookings').insert([draft]).select();
    if(error){ alert('Could not save: '+error.message); return; }
    state.bookings.push(data[0]);
  } else {
    draft.id = 'local-'+Date.now();
    state.bookings.push(draft);
  }
}
async function updateBooking(id, patch){
  const idx = state.bookings.findIndex(b=>b.id===id);
  if(idx>-1) state.bookings[idx] = {...state.bookings[idx], ...patch};
  if(sb){ const {error} = await sb.from('bookings').update(patch).eq('id', id); if(error) alert('Could not save: '+error.message); }
}
async function deleteBooking(id){
  state.bookings = state.bookings.filter(b=>b.id!==id);
  if(sb) await sb.from('bookings').delete().eq('id', id);
}

/* ---------------- Helpers ---------------- */
function mondayOf(d){ const x=new Date(d); const day=x.getDay(); x.setDate(x.getDate()+(day===0?-6:1-day)); x.setHours(0,0,0,0); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function iso(d){ return d.toISOString().slice(0,10); }
function fmtDate(d){ return d.toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'}); }
function fmtDateLong(d){ return d.toLocaleDateString('en-GB',{day:'numeric', month:'long', year:'numeric'}); }
function money(n, cur){ n = Number(n)||0; return (cur||'USD')+' '+n.toLocaleString(undefined,{minimumFractionDigits:0, maximumFractionDigits:2}); }
function roomCap(name){ const r = state.rooms.find(r=>r.name===name); return r? r.capacity : 0; }
function displayId(b){ return 'MNH-'+String(b.booking_no||0).padStart(4,'0'); }
function overlaps(aStart,aEnd,bStart,bEnd){ return aStart <= bEnd && bStart <= aEnd; }
function timeOverlap(aS,aE,bS,bE){ return aS < bE && bS < aE; }
function findConflicts(booking){
  return state.bookings.filter(b=>{
    if(b.id===booking.id) return false;
    if(b.room !== booking.room) return false;
    if(b.status==='Cancelled' || booking.status==='Cancelled') return false;
    if(!overlaps(booking.start_date, booking.end_date, b.start_date, b.end_date)) return false;
    return timeOverlap(booking.start_time||'00:00', booking.end_time||'23:59', b.start_time||'00:00', b.end_time||'23:59');
  });
}
function functionRevenue(b){ return (Number(b.function_rate)||0) * (Number(b.delegates)||0); }
function accommRevenue(b){ return (Number(b.accommodation_rate)||0) * (Number(b.nights)||0) * (Number(b.accommodation_delegates)||0); }
function isInWeek(b, weekStart){ const ws=iso(weekStart), we=iso(addDays(weekStart,6)); return overlaps(b.start_date, b.end_date, ws, we); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function openLightbox(src, alt){
  const ov = document.createElement('div');
  ov.className = 'lightbox-overlay';
  ov.innerHTML = `<img src="${src}" alt="${esc(alt||'Property photo')}">`;
  ov.addEventListener('click', ()=> ov.remove());
  document.addEventListener('keydown', function escClose(e){ if(e.key==='Escape'){ ov.remove(); document.removeEventListener('keydown', escClose); } });
  document.body.appendChild(ov);
}
function exportBookingsExcel(){
  const rows = state.bookings.map(b=>({
    'Booking ID':displayId(b), 'Client / Organisation':b.client, 'Conference / Event':b.event_name, 'Event Type':b.event_type,
    'Room / Venue':b.room, 'Status':b.status, 'Event Date':b.start_date, 'End Date':b.end_date,
    'Start Time':b.start_time, 'End Time':b.end_time, 'Delegates':b.delegates, 'Room Capacity':roomCap(b.room),
    'Capacity Utilisation %': roomCap(b.room)? Math.round((Number(b.delegates)||0)/roomCap(b.room)*100):0,
    'Double Booking Check': findConflicts(b).length? 'CLASH':'OK', 'Notes':b.notes,
    'Function Rate':b.function_rate, 'Currency':b.currency, 'Function Revenue':functionRevenue(b),
    'Accommodation Rate':b.accommodation_rate, 'Nights':b.nights, 'Accommodation Delegates':b.accommodation_delegates,
    'Accommodation Revenue':accommRevenue(b), 'Payment Status':b.payment_status,
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'BOOKING ENTRY');
  XLSX.writeFile(wb, 'Monomotapa_Bookings_'+iso(new Date())+'.xlsx');
}
function exportSummaryExcel(rows, ws){
  const data = rows.map(b=>({
    'Name':b.client, 'Type':b.event_type, 'Covers':b.delegates, 'Venue':b.room,
    'Time': (b.start_time||'')+(b.start_time? '-'+b.end_time:''), 'Rate':b.function_rate, 'Currency':b.currency,
    'Function Revenue':functionRevenue(b), 'Accommodation Rate':b.accommodation_rate, 'Nights':b.nights,
    'Number of Delegates':b.accommodation_delegates, 'Accommodation Revenue':accommRevenue(b), 'Payment Status':b.payment_status,
  }));
  const sheet = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheet, 'WEEKLY SUMMARY');
  XLSX.writeFile(wb, 'Monomotapa_Weekly_Summary_'+iso(ws)+'.xlsx');
}

/* ---------------- Render root ---------------- */
function render(){
  renderAuthGate();
  if(!state.loaded || !state.currentUser){
    document.getElementById('main').innerHTML=''; document.getElementById('nav').innerHTML=''; return;
  }
  renderNav();
  const main = document.getElementById('main');
  if(state.view==='dashboard') renderDashboard(main);
  else if(state.view==='board') renderBoard(main);
  else if(state.view==='approvals') renderApprovals(main);
  else if(state.view==='list') renderList(main);
  else if(state.view==='summary') renderSummary(main);
  else if(state.view==='settings') renderSettings(main);
}
function renderNav(){
  const nav = document.getElementById('nav');
  const pending = state.bookings.filter(b=>b.status==='Tentative').length;
  nav.innerHTML = NAV_ITEMS.map(it=>`<button data-view="${it.id}" class="${state.view===it.id?'active':''}"><span class="ic">${it.ic}</span>${it.label}${it.id==='approvals'&&pending?`<span class="nav-badge">${pending}</span>`:''}</button>`).join('');
  nav.querySelectorAll('button').forEach(btn=> btn.onclick = ()=>{ state.view = btn.dataset.view; render(); });
}
function renderAuthGate(){
  const gate = document.getElementById('authGate');
  const authedAs = document.getElementById('authedAs');
  if(!state.loaded){ return; }

  if(!sb){
    authedAs.style.display='none'; gate.style.display='flex';
    gate.innerHTML = `<div class="auth-card"><div class="mark">MONOMOTAPA</div><div class="sub">Almost there</div>
      <p style="font-size:13px; color:rgba(17,17,17,0.75);">This copy isn't connected to a database yet. Open this file, find the <code>SUPABASE_URL</code> / <code>SUPABASE_ANON_KEY</code> lines near the top of the script, and paste in the values from your Supabase project's API settings — see SETUP_GUIDE.md.</p></div>`;
    return;
  }

  if(state.currentUser){
    gate.style.display='none'; gate.innerHTML='';
    authedAs.style.display='flex';
    authedAs.innerHTML = `<span>Signed in as <b style="color:#fff;">${esc(state.currentUser)}</b></span><button id="signOutBtn">Sign out</button>`;
    document.getElementById('signOutBtn').onclick = async ()=>{ await sb.auth.signOut(); state.currentUser=null; render(); };
    return;
  }
  authedAs.style.display='none'; gate.style.display='flex';
  gate.innerHTML = `
    <div>
      <div class="auth-card">
        <div class="mark">MONOMOTAPA</div>
        <div class="sub">Sign in to the shared booking register</div>
        <label>Email</label><input type="email" id="loginEmail" autocomplete="username">
        <label>Password</label><input type="password" id="loginPassword" autocomplete="current-password">
        <button class="btn primary" id="loginBtn">Sign in</button>
        <div id="loginError"></div>
      </div>
      <div class="config-warning">Accounts for the three coordinators are created once, from the Supabase dashboard — there's no self-signup here by design.</div>
    </div>`;
  const attempt = async ()=>{
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    document.getElementById('loginError').innerHTML = '';
    const {error} = await sb.auth.signInWithPassword({email, password});
    if(error) document.getElementById('loginError').innerHTML = `<div class="auth-error">${esc(error.message)}</div>`;
    else await loadAll();
  };
  document.getElementById('loginBtn').onclick = attempt;
  document.getElementById('loginPassword').addEventListener('keydown', e=>{ if(e.key==='Enter') attempt(); });
}

/* ---------------- Dashboard ---------------- */
function renderDashboard(main){
  const today = new Date(); const ws = mondayOf(today);
  const active = state.bookings.filter(b=>b.status!=='Cancelled');
  const thisWeek = active.filter(b=>isInWeek(b, ws));
  const confirmed = active.filter(b=>b.status==='Confirmed');
  const tentative = active.filter(b=>b.status==='Tentative');
  const monthKey = today.toISOString().slice(0,7);
  const thisMonth = active.filter(b=> (b.start_date||'').slice(0,7)===monthKey );
  const revenue = thisMonth.reduce((s,b)=>s+functionRevenue(b)+accommRevenue(b),0);
  const delegatesMonth = thisMonth.reduce((s,b)=>s+(Number(b.delegates)||0),0);
  const upcoming = active.filter(b=>b.start_date >= iso(today)).sort((a,b)=>a.start_date.localeCompare(b.start_date)).slice(0,6);
  const utilRows = state.rooms.map(r=>{
    const inWeek = thisWeek.filter(b=>b.room===r.name);
    const pct = inWeek.length ? Math.min(100, Math.round(inWeek.reduce((s,b)=>s+((Number(b.delegates)||0)/r.capacity*100),0)/inWeek.length)) : 0;
    return `<div class="util-row"><span class="rn">${esc(r.name)}</span><div class="util-bar"><div style="width:${pct}%"></div></div><span class="util-pct">${pct}%</span></div>`;
  }).join('');
  main.innerHTML = `
    <div class="hero-banner">
      <img src="${IMAGES.entranceWide}" alt="Monomotapa Hotel entrance">
      <div class="hero-banner-overlay">
        <div class="hero-eyebrow">Monomotapa Hotel</div>
        <div class="hero-title">Conference &amp; Banqueting</div>
      </div>
    </div>
    <div class="topbar"><div><h1>Dashboard</h1><div class="meta">${fmtDateLong(today)} · week of ${fmtDate(ws)}</div></div></div>
    <div class="kpis">
      <div class="card kpi"><div class="label">Total bookings</div><div class="value">${active.length}</div><div class="sub">all future &amp; past, excl. cancelled</div></div>
      <div class="card kpi"><div class="label">Confirmed</div><div class="value">${confirmed.length}</div><div class="sub">secured functions</div></div>
      <div class="card kpi"><div class="label">Tentative</div><div class="value">${tentative.length}</div><div class="sub">holds awaiting confirmation</div></div>
      <div class="card kpi"><div class="label">Delegates this month</div><div class="value">${delegatesMonth}</div><div class="sub">${today.toLocaleDateString('en-GB',{month:'long'})}</div></div>
      <div class="card kpi"><div class="label">Est. revenue this month</div><div class="value" style="font-size:20px;">${revenue.toLocaleString(undefined,{maximumFractionDigits:0})}</div><div class="sub">function + accommodation, mixed currency</div></div>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="section-title">Upcoming functions <small>next 6</small></div>
        <ul class="plain">
          ${upcoming.length? upcoming.map(b=>`<li class="upcoming-item"><div><div class="who">${esc(b.client||'Untitled')} — ${esc(b.event_name||b.event_type)}</div><div class="when">${esc(b.room)} · ${b.start_date}${b.start_time? ' · '+b.start_time+'–'+b.end_time:''}</div></div><span class="badge ${b.status}">${b.status}</span></li>`).join('') : '<div class="empty-state">Nothing booked yet — add your first function.</div>'}
        </ul>
      </div>
      <div class="card">
        <div class="section-title">Room utilisation <small>this week, by delegates vs. capacity</small></div>
        <div style="padding:8px 0;">${utilRows}</div>
      </div>
    </div>`;
}

/* ---------------- Approvals ---------------- */

    <div class="topbar"><div><h1>Approvals</h1><div class="meta">Tentative holds waiting to be confirmed or declined</div></div></div>

/* ---------------- All bookings ---------------- */
function renderList(main){
  const f = state.filters;
  let rows = state.bookings.slice().sort((a,b)=> (a.start_date||'').localeCompare(b.start_date||''));
  if(f.status!=='All') rows = rows.filter(b=>b.status===f.status);
  if(f.room!=='All') rows = rows.filter(b=>b.room===f.room);
  if(f.type!=='All') rows = rows.filter(b=>b.event_type===f.type);
  if(f.search) rows = rows.filter(b=> (b.client+' '+b.event_name).toLowerCase().includes(f.search.toLowerCase()));
  main.innerHTML = `
    <div class="topbar"><div><h1>All bookings</h1><div class="meta">${rows.length} of ${state.bookings.length} shown</div></div></div>
    <div class="toolbar">
      <input type="text" id="fSearch" placeholder="Search client or event…" value="${esc(f.search)}">
      <select id="fStatus"><option value="All">All statuses</option>${STATUSES.map(s=>`<option ${f.status===s?'selected':''}>${s}</option>`).join('')}</select>
      <select id="fRoom"><option value="All">All rooms</option>${state.rooms.map(r=>`<option ${f.room===r.name?'selected':''}>${esc(r.name)}</option>`).join('')}</select>
      <select id="fType"><option value="All">All event types</option>${EVENT_TYPES.map(t=>`<option ${f.type===t?'selected':''}>${t}</option>`).join('')}</select>
      <button class="btn secondary" id="exportXlsx">Export to Excel</button>
    </div>
    <div class="card" style="overflow-x:auto;">
      ${rows.length? `<table class="list">
        <thead><tr><th>ID</th><th>Client</th><th>Event</th><th>Type</th><th>Room</th><th>Status</th><th>Date</th><th>Time</th><th>Delegates</th><th>Capacity %</th><th>Payment</th><th></th></tr></thead>
        <tbody>
          ${rows.map(b=>{
            const conflicts = findConflicts(b);
            const util = roomCap(b.room)? Math.round((Number(b.delegates)||0)/roomCap(b.room)*100) : 0;
            return `<tr>
              <td style="font-family:'IBM Plex Mono',monospace; font-size:12px;">${displayId(b)}</td>
              <td>${esc(b.client)}</td><td>${esc(b.event_name)}</td><td>${esc(b.event_type)}</td><td>${esc(b.room)}</td>
              <td><span class="badge ${b.status}">${b.status}</span></td>

              <td>${b.start_time||''}${b.start_time? '–'+b.end_time : ''}</td>
              <td>${b.delegates||0}</td>
              <td>${conflicts.length? `<span class="conflict">${util}% ⚠ clash</span>` : util+'%'}</td>
              <td>${esc(b.payment_status||'')}</td>
              <td><button class="rowbtn" data-edit="${b.id}">Edit</button> <button class="rowbtn danger" data-del="${b.id}">Delete</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>` : `<div class="empty-state"><div class="glyph">&#9723;</div>No bookings match these filters yet.</div>`}
    </div>`;
  document.getElementById('fSearch').oninput = e=>{ state.filters.search = e.target.value; renderList(main); };
  document.getElementById('fStatus').onchange = e=>{ state.filters.status = e.target.value; renderList(main); };
  document.getElementById('fRoom').onchange = e=>{ state.filters.room = e.target.value; renderList(main); };
  document.getElementById('fType').onchange = e=>{ state.filters.type = e.target.value; renderList(main); };

  main.querySelectorAll('[data-del]').forEach(b=> b.onclick = async ()=>{
    if(confirm('Delete this booking permanently?')){ await deleteBooking(b.dataset.del); renderList(main); }

        <div style="padding:14px 18px; font-size:13px;">
          <p><b>Statuses:</b> ${STATUSES.join(', ')}</p>
          <p><b>Event types:</b> ${EVENT_TYPES.join(', ')}</p>
          <p><b>Payment statuses:</b> ${PAYMENT_STATUSES.join(', ')}</p>
          <p style="color:rgba(17,17,17,0.55);">Tentative = hold or enquiry · Confirmed = secured · Completed = held · Cancelled = no longer proceeding.</p>
        </div>
      </div>
      <div class="card">
        <div class="section-title">Accounts &amp; security</div>
        <div style="padding:14px 18px; font-size:13px; color:rgba(17,17,17,0.75);">
          Coordinator accounts (email + password) are managed from the Supabase dashboard under Authentication → Users — add, remove, or reset a password there. Every request to this data is checked against the database's own access rules, so only signed-in coordinators can see or change anything.
        </div>
      </div>
    </div>`;
  document.getElementById('saveRooms').onclick = async ()=>{
    for(const inp of main.querySelectorAll('.room-card input')){ await saveRoomCapacity(Number(inp.dataset.id), Number(inp.value)||0); }
    render();
  };
  main.querySelectorAll('.gallery-thumb').forEach(t=> t.onclick = ()=> openLightbox(t.dataset.full, t.querySelector('img').alt));
}

/* ---------------- Booking modal ---------------- */
function openBookingModal(id, prefill){
  const editing = id ? state.bookings.find(b=>b.id===id) : null;
  const b = editing ? {...editing} : {
    id:null, client:'', event_name:'', event_type:'Conference', room:(prefill&&prefill.room)||state.rooms[0].name,
    status:'Tentative', start_date:(prefill&&prefill.start_date)||iso(new Date()), end_date:(prefill&&prefill.end_date)||(prefill&&prefill.start_date)||iso(new Date()),
    start_time:'08:00', end_time:'17:00', delegates:0, function_rate:0, currency:'USD',
    accommodation_rate:0, nights:0, accommodation_delegates:0, payment_status:'Pending', notes:''
  };
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head"><h2>${editing? 'Edit booking':'New booking'}</h2><button id="closeModal">&times;</button></div>
      <div class="modal-body"><div class="formgrid">
        <div><label>Client / organisation</label><input id="mClient" value="${esc(b.client)}"></div>
        <div><label>Conference / event name</label><input id="mEvent" value="${esc(b.event_name)}"></div>
        <div><label>Event type</label><select id="mType">${EVENT_TYPES.map(t=>`<option ${b.event_type===t?'selected':''}>${t}</option>`).join('')}</select></div>
        <div><label>Room / venue</label><select id="mRoom">${state.rooms.map(r=>`<option ${b.room===r.name?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div>
        <div><label>Status</label><select id="mStatus">${STATUSES.map(s=>`<option ${b.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div><label>Payment status</label><select id="mPay">${PAYMENT_STATUSES.map(s=>`<option ${b.payment_status===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div><label>Event date</label><input type="date" id="mStart" value="${b.start_date}"></div>
        <div><label>End date</label><input type="date" id="mEnd" value="${b.end_date}"></div>
        <div><label>Start time</label><input type="time" id="mStime" value="${b.start_time}"></div>
        <div><label>End time</label><input type="time" id="mEtime" value="${b.end_time}"></div>
        <div><label>Delegates</label><input type="number" min="0" id="mDelegates" value="${b.delegates}"></div>
        <div><label>Currency</label><select id="mCur">${CURRENCIES.map(c=>`<option ${b.currency===c?'selected':''}>${c}</option>`).join('')}</select></div>
        <div><label>Function rate (per delegate)</label><input type="number" min="0" step="0.01" id="mRate" value="${b.function_rate}"></div>
        <div><label>Accommodation rate (per night)</label><input type="number" min="0" step="0.01" id="mAccRate" value="${b.accommodation_rate}"></div>
        <div><label>Nights</label><input type="number" min="0" id="mNights" value="${b.nights}"></div>
        <div><label>Accommodation delegates</label><input type="number" min="0" id="mAccDel" value="${b.accommodation_delegates}"></div>
        <div class="full"><label>Notes</label><textarea id="mNotes">${esc(b.notes)}</textarea></div>
        <div class="full" id="conflictBox"></div>
      </div></div>
      <div class="modal-foot">
        <div>${editing? `<button class="btn ghost" id="deleteBtn">Delete booking</button>`:''}</div>
        <div style="display:flex; gap:8px;"><button class="btn secondary" id="cancelBtn">Cancel</button><button class="btn primary" id="saveBtn">${editing? 'Save changes':'Create booking'}</button></div>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  function readForm(){
    return {
      client: document.getElementById('mClient').value.trim(),
      event_name: document.getElementById('mEvent').value.trim(),
      event_type: document.getElementById('mType').value,
      room: document.getElementById('mRoom').value,
      status: document.getElementById('mStatus').value,
      payment_status: document.getElementById('mPay').value,
      start_date: document.getElementById('mStart').value,
      end_date: document.getElementById('mEnd').value || document.getElementById('mStart').value,
      start_time: document.getElementById('mStime').value,
      end_time: document.getElementById('mEtime').value,
      delegates: Number(document.getElementById('mDelegates').value)||0,
      currency: document.getElementById('mCur').value,
      function_rate: Number(document.getElementById('mRate').value)||0,
      accommodation_rate: Number(document.getElementById('mAccRate').value)||0,
      nights: Number(document.getElementById('mNights').value)||0,
      accommodation_delegates: Number(document.getElementById('mAccDel').value)||0,
      notes: document.getElementById('mNotes').value,
    };
  }
  function checkConflicts(){
    const draft = {...readForm(), id: editing? b.id : null};
    const conflicts = findConflicts(draft);
    const box = document.getElementById('conflictBox');
    const cap = roomCap(draft.room);
    let html='';
    if(conflicts.length) html += `<div class="warn-box">Double-booking check: this clashes with ${conflicts.map(c=>esc(c.client||c.event_name)+' ('+c.start_time+'–'+c.end_time+')').join(', ')} in ${esc(draft.room)}.</div>`;
    if(cap && draft.delegates > cap) html += `<div class="warn-box">Delegates (${draft.delegates}) exceed ${esc(draft.room)}'s capacity of ${cap}.</div>`;
    box.innerHTML = html;
  }
  overlay.querySelectorAll('input,select,textarea').forEach(el=> el.addEventListener('input', checkConflicts));
  checkConflicts();

  overlay.querySelector('#closeModal').onclick = ()=>overlay.remove();
  overlay.querySelector('#cancelBtn').onclick = ()=>overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  const delBtn = overlay.querySelector('#deleteBtn');
  if(delBtn) delBtn.onclick = async ()=>{ if(confirm('Delete this booking permanently?')){ await deleteBooking(b.id); overlay.remove(); render(); } };
  overlay.querySelector('#saveBtn').onclick = async ()=>{
    const draft = readForm();
    if(!draft.client){ alert('Please add a client or organisation name.'); return; }
    if(editing){ await updateBooking(b.id, draft); }
    else { draft.created_by = state.currentUser; await insertBooking(draft); }
    overlay.remove();
    render();
  };
}

document.getElementById('newBookingBtn').onclick = ()=>openBookingModal(null);
init();
</script>
</body>
</html>

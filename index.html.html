<!DOCTYPE html>

<style>

  h1,h2,h3,.display{font-family:'Fraunces', serif; color:var(--ink); margin:0;}

  nav.primary{padding:14px 12px; display:flex; flex-direction:column; gap:2px; flex:1;}
  nav.primary button{display:flex; align-items:center; gap:10px; text-align:left; background:transparent; border:none; color:#D8DED6; font-family:'IBM Plex Sans', sans-serif; font-size:13.5px; padding:10px 12px; border-radius:7px; cursor:pointer; transition:background .15s ease, color .15s ease; position:relative;}
  nav.primary button:hover{background:rgba(255,255,255,0.06); color:#fff;}
  nav.primary button.active{background:#274F45; color:#fff; font-weight:500; box-shadow:inset 3px 0 0 var(--gold);}
  nav.primary .ic{width:16px; text-align:center; opacity:0.85; font-size:14px;}
  .nav-badge{margin-left:auto; background:var(--gold); color:#241A0C; border-radius:20px; font-size:10.5px; font-weight:700; padding:1px 7px;}

  .sidebar-foot .hint{margin-top:10px; font-size:11px; color:#93A69C; line-height:1.5;}
  main{flex:1; min-width:0; padding:28px 34px 60px 34px;}

  .topbar h1{font-size:24px; font-weight:600;}
  .topbar .meta{color:var(--slate); font-size:13px; margin-top:3px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow);}
  .kpis{display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:22px;}

  .kpi .value{font-family:'Fraunces', serif; font-size:26px; margin-top:6px; color:var(--teal-deep);}
  .kpi .sub{font-size:11.5px; color:var(--slate); margin-top:2px;}
  .grid2{display:grid; grid-template-columns:1.4fr 1fr; gap:16px;}

  table.list{width:100%; border-collapse:collapse; font-size:13px;}

  .empty-state{padding:50px 20px; text-align:center; color:var(--slate);}
  .empty-state .glyph{font-size:26px; margin-bottom:10px; color:var(--gold);}
  .overlay{position:fixed; inset:0; background:rgba(24,20,14,0.45); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; z-index:50;}

  .modal-foot{padding:16px 22px; border-top:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  .btn{border:none; border-radius:7px; padding:9px 16px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit;}

  .settings-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .room-row{display:flex; align-items:center; justify-content:space-between; padding:9px 18px; border-bottom:1px solid var(--line); font-size:13px;}
  .room-row:last-child{border-bottom:none;}

  .room-card{background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .room-card .art{height:96px; background:var(--stone-deep); display:flex; align-items:center; justify-content:center;}
  .room-card .art svg{width:100%; height:100%;}
  .room-card .info{padding:10px 12px;}
  .room-card .info .rname{font-weight:600; font-size:13px;}
  .room-card .info .rcap{color:var(--slate); font-size:11.5px; margin-top:2px;}
  .approval-item{padding:14px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;}
  .approval-item:last-child{border-bottom:none;}
  .approval-item .details{font-size:13px;}
  .approval-item .details .who{font-weight:600;}
  .approval-item .details .when{color:var(--slate); font-size:12px; margin-top:2px;}
  .approval-actions{display:flex; gap:8px; align-items:center;}
  .approval-actions input{width:150px;}
  .summary-controls{display:flex; gap:22px; align-items:center; margin-bottom:16px; flex-wrap:wrap;}
  .totals-strip{display:flex; gap:22px; padding:14px 18px; border-top:2px solid var(--line); font-size:13px; flex-wrap:wrap;}
  .totals-strip b{font-family:'Fraunces',serif; font-size:15px; color:var(--teal-deep);}
  .auth-gate{position:fixed; inset:0; z-index:200; background:var(--teal-deep); display:flex; align-items:center; justify-content:center; padding:20px;
    background-image: linear-gradient(135deg, transparent 46%, rgba(169,119,44,0.18) 46%, rgba(169,119,44,0.18) 54%, transparent 54%),
                       linear-gradient(45deg, transparent 46%, rgba(169,119,44,0.18) 46%, rgba(169,119,44,0.18) 54%, transparent 54%);
    background-size:34px 34px;}
  .auth-card{background:var(--panel); border-radius:14px; width:100%; max-width:380px; padding:30px 28px; box-shadow:0 20px 60px rgba(0,0,0,0.35);}
  .auth-card .mark{font-family:'Fraunces',serif; font-size:22px; font-weight:600; color:var(--teal-deep); text-align:center;}
  .auth-card .sub{text-align:center; color:var(--slate); font-size:12.5px; margin-top:2px; margin-bottom:22px;}
  .auth-card label{margin-top:12px;}
  .auth-card .btn{width:100%; margin-top:18px; padding:11px;}
  .auth-error{background:#F1DAD3; color:#7C3823; border-radius:7px; padding:9px 11px; font-size:12.5px; margin-top:14px;}
  .authed-as{display:flex; align-items:center; justify-content:space-between; padding:12px 20px; border-top:1px solid rgba(255,255,255,0.08); font-size:12.5px; color:#CBD6CF;}
  .authed-as button{background:none; border:none; color:var(--gold-soft); cursor:pointer; font-size:12px; font-weight:600;}
  .config-warning{max-width:460px; margin:16px auto 0; font-size:11.5px; color:#E8C79A; text-align:center; line-height:1.5;}
  @media (max-width: 980px){ .kpis{grid-template-columns:repeat(2,1fr);} .grid2{grid-template-columns:1fr;} .formgrid{grid-template-columns:1fr;} }
  @media (max-width: 720px){ .app{flex-direction:column;} .sidebar{width:100%; height:auto; position:relative;} nav.primary{flex-direction:row; overflow-x:auto;} main{padding:18px;} }
</style>

<body>
<div id="authGate" style="display:flex;" class="auth-gate"><div class="auth-card"><div class="mark">MONOMOTAPA</div><div class="sub">Loading the shared register&hellip;</div></div></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">MONOMOTAPA</div>
      <div class="sub">Conference &amp; Banqueting</div>
    </div>
    <div class="chevrons"></div>
    <nav class="primary" id="nav"></nav>
    <div class="sidebar-foot">
      <button id="newBookingBtn">+ New booking</button>
      <div class="hint">Shared register, backed by a real database — every coordinator sees the same live data.</div>
    </div>
    <div class="authed-as" id="authedAs"></div>
  </aside>
  <main id="main"></main>
</div>

<script>
/* =====================================================================
   SETUP — fill these in once you've created your Supabase project.
   Dashboard -> Project settings -> API -> "Project URL" and "anon public" key.
   These two values are meant to be public (they're safe to ship in a
   front-end file) — real protection comes from the database policies
   in schema.sql, not from hiding this key.
   ===================================================================== */
const SUPABASE_URL = 'https://jrbdqfvsveklrxdjabwt.supabase.co';

const SUPABASE_ANON_KEY = 'sb_publishable_3xQL4gHD_veW5wN1ULtFug_9Q1FY5fU';

/* ===================================================================== */

const sb = SUPABASE_URL.startsWith('http')
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

const DEFAULT_ROOMS_FALLBACK = [
  {id:1,name:'Great Indaba', capacity:200},{id:2,name:'Aquarium', capacity:80},{id:3,name:'Ophir', capacity:60},
  {id:4,name:'Conference Room 1 (NZC)', capacity:40},{id:5,name:'FR4 Breakaway', capacity:20},
];
const EVENT_TYPES = ['Conference','Workshop','Training','Meeting','Dinner','Wedding','Other'];
const STATUSES = ['Tentative','Confirmed','Completed','Cancelled'];
const PAYMENT_STATUSES = ['Pending','Invoiced','Purchase Order','Paid'];
const CURRENCIES = ['USD','ZWG'];
const NAV_ITEMS = [
  {id:'dashboard', label:'Dashboard', ic:'&#9673;'},
  {id:'board', label:'Booking board', ic:'&#9638;'},
  {id:'approvals', label:'Approvals', ic:'&#10003;'},
  {id:'list', label:'All bookings', ic:'&#9776;'},
  {id:'summary', label:'Weekly summary', ic:'&#8981;'},
  {id:'settings', label:'Settings', ic:'&#9881;'},
];

let state = {
  bookings: [],
  rooms: DEFAULT_ROOMS_FALLBACK.map(r=>({...r})),
  currentUser: null,
  view: 'dashboard',
  weekStart: mondayOf(new Date()),
  summaryWeekStart: mondayOf(new Date()),
  filters: {status:'All', room:'All', type:'All', search:''},
  loaded:false,
};

/* ---------------- Auth + data loading ---------------- */
async function init(){
  if(!sb){ state.loaded = true; render(); return; } // config not filled in yet — gate shows a warning
  const { data:{ session } } = await sb.auth.getSession();
  if(session) state.currentUser = session.user.user_metadata.full_name || session.user.email;
  sb.auth.onAuthStateChange((event, session)=>{
    if(event==='SIGNED_IN') state.currentUser = session.user.user_metadata.full_name || session.user.email;
    if(event==='SIGNED_OUT') state.currentUser = null;
    render();
  });
  await loadAll();
}
async function loadAll(){
  if(sb && state.currentUser){
    const [{data:rooms}, {data:bookings}] = await Promise.all([
      sb.from('rooms').select('*').order('id'),
      sb.from('bookings').select('*').order('start_date'),
    ]);
    if(rooms) state.rooms = rooms;
    if(bookings) state.bookings = bookings;
  }
  state.loaded = true;
  render();
}
async function saveRoomCapacity(id, capacity){
  const room = state.rooms.find(r=>r.id===id);
  if(room) room.capacity = capacity;
  if(sb) await sb.from('rooms').update({capacity}).eq('id', id);
}
async function insertBooking(draft){
  if(sb){
    const {data, error} = await sb.from('bookings').insert([draft]).select();
    if(error){ alert('Could not save: '+error.message); return; }
    state.bookings.push(data[0]);
  } else {
    draft.id = 'local-'+Date.now();
    state.bookings.push(draft);
  }
}
async function updateBooking(id, patch){
  const idx = state.bookings.findIndex(b=>b.id===id);
  if(idx>-1) state.bookings[idx] = {...state.bookings[idx], ...patch};
  if(sb){ const {error} = await sb.from('bookings').update(patch).eq('id', id); if(error) alert('Could not save: '+error.message); }
}
async function deleteBooking(id){
  state.bookings = state.bookings.filter(b=>b.id!==id);
  if(sb) await sb.from('bookings').delete().eq('id', id);
}

/* ---------------- Helpers ---------------- */
function mondayOf(d){ const x=new Date(d); const day=x.getDay(); x.setDate(x.getDate()+(day===0?-6:1-day)); x.setHours(0,0,0,0); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function iso(d){ return d.toISOString().slice(0,10); }
function fmtDate(d){ return d.toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'}); }
function fmtDateLong(d){ return d.toLocaleDateString('en-GB',{day:'numeric', month:'long', year:'numeric'}); }
function money(n, cur){ n = Number(n)||0; return (cur||'USD')+' '+n.toLocaleString(undefined,{minimumFractionDigits:0, maximumFractionDigits:2}); }
function roomCap(name){ const r = state.rooms.find(r=>r.name===name); return r? r.capacity : 0; }
function displayId(b){ return 'MNH-'+String(b.booking_no||0).padStart(4,'0'); }
function overlaps(aStart,aEnd,bStart,bEnd){ return aStart <= bEnd && bStart <= aEnd; }
function timeOverlap(aS,aE,bS,bE){ return aS < bE && bS < aE; }
function findConflicts(booking){
  return state.bookings.filter(b=>{
    if(b.id===booking.id) return false;
    if(b.room !== booking.room) return false;
    if(b.status==='Cancelled' || booking.status==='Cancelled') return false;
    if(!overlaps(booking.start_date, booking.end_date, b.start_date, b.end_date)) return false;
    return timeOverlap(booking.start_time||'00:00', booking.end_time||'23:59', b.start_time||'00:00', b.end_time||'23:59');
  });
}
function functionRevenue(b){ return (Number(b.function_rate)||0) * (Number(b.delegates)||0); }
function accommRevenue(b){ return (Number(b.accommodation_rate)||0) * (Number(b.nights)||0) * (Number(b.accommodation_delegates)||0); }
function isInWeek(b, weekStart){ const ws=iso(weekStart), we=iso(addDays(weekStart,6)); return overlaps(b.start_date, b.end_date, ws, we); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function exportBookingsExcel(){
  const rows = state.bookings.map(b=>({
    'Booking ID':displayId(b), 'Client / Organisation':b.client, 'Conference / Event':b.event_name, 'Event Type':b.event_type,
    'Room / Venue':b.room, 'Status':b.status, 'Event Date':b.start_date, 'End Date':b.end_date,
    'Start Time':b.start_time, 'End Time':b.end_time, 'Delegates':b.delegates, 'Room Capacity':roomCap(b.room),
    'Capacity Utilisation %': roomCap(b.room)? Math.round((Number(b.delegates)||0)/roomCap(b.room)*100):0,
    'Double Booking Check': findConflicts(b).length? 'CLASH':'OK', 'Notes':b.notes,
    'Function Rate':b.function_rate, 'Currency':b.currency, 'Function Revenue':functionRevenue(b),
    'Accommodation Rate':b.accommodation_rate, 'Nights':b.nights, 'Accommodation Delegates':b.accommodation_delegates,
    'Accommodation Revenue':accommRevenue(b), 'Payment Status':b.payment_status,
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'BOOKING ENTRY');
  XLSX.writeFile(wb, 'Monomotapa_Bookings_'+iso(new Date())+'.xlsx');
}
function exportSummaryExcel(rows, ws){
  const data = rows.map(b=>({
    'Name':b.client, 'Type':b.event_type, 'Covers':b.delegates, 'Venue':b.room,
    'Time': (b.start_time||'')+(b.start_time? '-'+b.end_time:''), 'Rate':b.function_rate, 'Currency':b.currency,
    'Function Revenue':functionRevenue(b), 'Accommodation Rate':b.accommodation_rate, 'Nights':b.nights,
    'Number of Delegates':b.accommodation_delegates, 'Accommodation Revenue':accommRevenue(b), 'Payment Status':b.payment_status,
  }));
  const sheet = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheet, 'WEEKLY SUMMARY');
  XLSX.writeFile(wb, 'Monomotapa_Weekly_Summary_'+iso(ws)+'.xlsx');
}

/* ---------------- Render root ---------------- */
function render(){
  renderAuthGate();
  if(!state.loaded || !state.currentUser){
    document.getElementById('main').innerHTML=''; document.getElementById('nav').innerHTML=''; return;
  }
  renderNav();
  const main = document.getElementById('main');
  if(state.view==='dashboard') renderDashboard(main);
  else if(state.view==='board') renderBoard(main);
  else if(state.view==='approvals') renderApprovals(main);
  else if(state.view==='list') renderList(main);
  else if(state.view==='summary') renderSummary(main);
  else if(state.view==='settings') renderSettings(main);
}
function renderNav(){
  const nav = document.getElementById('nav');
  const pending = state.bookings.filter(b=>b.status==='Tentative').length;
  nav.innerHTML = NAV_ITEMS.map(it=>`<button data-view="${it.id}" class="${state.view===it.id?'active':''}"><span class="ic">${it.ic}</span>${it.label}${it.id==='approvals'&&pending?`<span class="nav-badge">${pending}</span>`:''}</button>`).join('');
  nav.querySelectorAll('button').forEach(btn=> btn.onclick = ()=>{ state.view = btn.dataset.view; render(); });
}
function renderAuthGate(){
  const gate = document.getElementById('authGate');
  const authedAs = document.getElementById('authedAs');
  if(!state.loaded){ return; }

  if(!sb){
    authedAs.style.display='none'; gate.style.display='flex';
    gate.innerHTML = `<div class="auth-card"><div class="mark">MONOMOTAPA</div><div class="sub">Almost there</div>
      <p style="font-size:13px; color:var(--ink-soft);">This copy isn't connected to a database yet. Open this file, find the <code>SUPABASE_URL</code> / <code>SUPABASE_ANON_KEY</code> lines near the top of the script, and paste in the values from your Supabase project's API settings — see SETUP_GUIDE.md.</p></div>`;
    return;
  }

  if(state.currentUser){
    gate.style.display='none'; gate.innerHTML='';
    authedAs.style.display='flex';
    authedAs.innerHTML = `<span>Signed in as <b style="color:#fff;">${esc(state.currentUser)}</b></span><button id="signOutBtn">Sign out</button>`;
    document.getElementById('signOutBtn').onclick = async ()=>{ await sb.auth.signOut(); state.currentUser=null; render(); };
    return;
  }
  authedAs.style.display='none'; gate.style.display='flex';
  gate.innerHTML = `
    <div>
      <div class="auth-card">
        <div class="mark">MONOMOTAPA</div>
        <div class="sub">Sign in to the shared booking register</div>
        <label>Email</label><input type="email" id="loginEmail" autocomplete="username">
        <label>Password</label><input type="password" id="loginPassword" autocomplete="current-password">
        <button class="btn primary" id="loginBtn">Sign in</button>
        <div id="loginError"></div>
      </div>
      <div class="config-warning">Accounts for the three coordinators are created once, from the Supabase dashboard — there's no self-signup here by design.</div>
    </div>`;
  const attempt = async ()=>{
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    document.getElementById('loginError').innerHTML = '';
    const {error} = await sb.auth.signInWithPassword({email, password});
    if(error) document.getElementById('loginError').innerHTML = `<div class="auth-error">${esc(error.message)}</div>`;
    else await loadAll();
  };
  document.getElementById('loginBtn').onclick = attempt;
  document.getElementById('loginPassword').addEventListener('keydown', e=>{ if(e.key==='Enter') attempt(); });
}

/* ---------------- Dashboard ---------------- */
function renderDashboard(main){
  const today = new Date(); const ws = mondayOf(today);
  const active = state.bookings.filter(b=>b.status!=='Cancelled');
  const thisWeek = active.filter(b=>isInWeek(b, ws));
  const confirmed = active.filter(b=>b.status==='Confirmed');
  const tentative = active.filter(b=>b.status==='Tentative');
  const monthKey = today.toISOString().slice(0,7);
  const thisMonth = active.filter(b=> (b.start_date||'').slice(0,7)===monthKey );
  const revenue = thisMonth.reduce((s,b)=>s+functionRevenue(b)+accommRevenue(b),0);
  const delegatesMonth = thisMonth.reduce((s,b)=>s+(Number(b.delegates)||0),0);
  const upcoming = active.filter(b=>b.start_date >= iso(today)).sort((a,b)=>a.start_date.localeCompare(b.start_date)).slice(0,6);
  const utilRows = state.rooms.map(r=>{
    const inWeek = thisWeek.filter(b=>b.room===r.name);
    const pct = inWeek.length ? Math.min(100, Math.round(inWeek.reduce((s,b)=>s+((Number(b.delegates)||0)/r.capacity*100),0)/inWeek.length)) : 0;
    return `<div class="util-row"><span class="rn">${esc(r.name)}</span><div class="util-bar"><div style="width:${pct}%"></div></div><span class="util-pct">${pct}%</span></div>`;
  }).join('');
  main.innerHTML = `
    <div class="topbar"><div><h1>Dashboard</h1><div class="meta">${fmtDateLong(today)} · week of ${fmtDate(ws)}</div></div></div>
    <div class="kpis">
      <div class="card kpi"><div class="label">Total bookings</div><div class="value">${active.length}</div><div class="sub">all future &amp; past, excl. cancelled</div></div>
      <div class="card kpi"><div class="label">Confirmed</div><div class="value">${confirmed.length}</div><div class="sub">secured functions</div></div>
      <div class="card kpi"><div class="label">Tentative</div><div class="value">${tentative.length}</div><div class="sub">holds awaiting confirmation</div></div>
      <div class="card kpi"><div class="label">Delegates this month</div><div class="value">${delegatesMonth}</div><div class="sub">${today.toLocaleDateString('en-GB',{month:'long'})}</div></div>
      <div class="card kpi"><div class="label">Est. revenue this month</div><div class="value" style="font-size:20px;">${revenue.toLocaleString(undefined,{maximumFractionDigits:0})}</div><div class="sub">function + accommodation, mixed currency</div></div>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="section-title">Upcoming functions <small>next 6</small></div>
        <ul class="plain">
          ${upcoming.length? upcoming.map(b=>`<li class="upcoming-item"><div><div class="who">${esc(b.client||'Untitled')} — ${esc(b.event_name||b.event_type)}</div><div class="when">${esc(b.room)} · ${b.start_date}${b.start_time? ' · '+b.start_time+'–'+b.end_time:''}</div></div><span class="badge ${b.status}">${b.status}</span></li>`).join('') : '<div class="empty-state">Nothing booked yet — add your first function.</div>'}
        </ul>
      </div>
      <div class="card">
        <div class="section-title">Room utilisation <small>this week, by delegates vs. capacity</small></div>
        <div style="padding:8px 0;">${utilRows}</div>
      </div>
    </div>`;
}

/* ---------------- Approvals ---------------- */

    <div class="topbar"><div><h1>Approvals</h1><div class="meta">Tentative holds waiting to be confirmed or declined</div></div></div>

  if(f.type!=='All') rows = rows.filter(b=>b.event_type===f.type);
  if(f.search) rows = rows.filter(b=> (b.client+' '+b.event_name).toLowerCase().includes(f.search.toLowerCase()));
  main.innerHTML = `
    <div class="topbar"><div><h1>All bookings</h1><div class="meta">${rows.length} of ${state.bookings.length} shown</div></div></div>
    <div class="toolbar">
      <input type="text" id="fSearch" placeholder="Search client or event…" value="${esc(f.search)}">

      <select id="fRoom"><option value="All">All rooms</option>${state.rooms.map(r=>`<option ${f.room===r.name?'selected':''}>${esc(r.name)}</option>`).join('')}</select>

        <tbody>
          ${rows.map(b=>{

              <td style="font-family:'IBM Plex Mono',monospace; font-size:12px;">${displayId(b)}</td>

              <td><button class="rowbtn" data-edit="${b.id}">Edit</button> <button class="rowbtn danger" data-del="${b.id}">Delete</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>` : `<div class="empty-state"><div class="glyph">&#9723;</div>No bookings match these filters yet.</div>`}

  document.getElementById('fSearch').oninput = e=>{ state.filters.search = e.target.value; renderList(main); };
  document.getElementById('fStatus').onchange = e=>{ state.filters.status = e.target.value; renderList(main); };
  document.getElementById('fRoom').onchange = e=>{ state.filters.room = e.target.value; renderList(main); };
  document.getElementById('fType').onchange = e=>{ state.filters.type = e.target.value; renderList(main); };

    id:null, client:'', event_name:'', event_type:'Conference', room:(prefill&&prefill.room)||state.rooms[0].name,
    status:'Tentative', start_date:(prefill&&prefill.start_date)||iso(new Date()), end_date:(prefill&&prefill.end_date)||(prefill&&prefill.start_date)||iso(new Date()),
    start_time:'08:00', end_time:'17:00', delegates:0, function_rate:0, currency:'USD',
    accommodation_rate:0, nights:0, accommodation_delegates:0, payment_status:'Pending', notes:''
  };
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head"><h2>${editing? 'Edit booking':'New booking'}</h2><button id="closeModal">&times;</button></div>
      <div class="modal-body"><div class="formgrid">
        <div><label>Client / organisation</label><input id="mClient" value="${esc(b.client)}"></div>
        <div><label>Conference / event name</label><input id="mEvent" value="${esc(b.event_name)}"></div>
        <div><label>Event type</label><select id="mType">${EVENT_TYPES.map(t=>`<option ${b.event_type===t?'selected':''}>${t}</option>`).join('')}</select></div>
        <div><label>Room / venue</label><select id="mRoom">${state.rooms.map(r=>`<option ${b.room===r.name?'selected':''}>${esc(r.name)}</option>`).join('')}</select></div>
        <div><label>Status</label><select id="mStatus">${STATUSES.map(s=>`<option ${b.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div><label>Payment status</label><select id="mPay">${PAYMENT_STATUSES.map(s=>`<option ${b.payment_status===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div><label>Event date</label><input type="date" id="mStart" value="${b.start_date}"></div>
        <div><label>End date</label><input type="date" id="mEnd" value="${b.end_date}"></div>
        <div><label>Start time</label><input type="time" id="mStime" value="${b.start_time}"></div>
        <div><label>End time</label><input type="time" id="mEtime" value="${b.end_time}"></div>
        <div><label>Delegates</label><input type="number" min="0" id="mDelegates" value="${b.delegates}"></div>
        <div><label>Currency</label><select id="mCur">${CURRENCIES.map(c=>`<option ${b.currency===c?'selected':''}>${c}</option>`).join('')}</select></div>
        <div><label>Function rate (per delegate)</label><input type="number" min="0" step="0.01" id="mRate" value="${b.function_rate}"></div>
        <div><label>Accommodation rate (per night)</label><input type="number" min="0" step="0.01" id="mAccRate" value="${b.accommodation_rate}"></div>
        <div><label>Nights</label><input type="number" min="0" id="mNights" value="${b.nights}"></div>
        <div><label>Accommodation delegates</label><input type="number" min="0" id="mAccDel" value="${b.accommodation_delegates}"></div>
        <div class="full"><label>Notes</label><textarea id="mNotes">${esc(b.notes)}</textarea></div>
        <div class="full" id="conflictBox"></div>
      </div></div>
      <div class="modal-foot">
        <div>${editing? `<button class="btn ghost" id="deleteBtn">Delete booking</button>`:''}</div>
        <div style="display:flex; gap:8px;"><button class="btn secondary" id="cancelBtn">Cancel</button><button class="btn primary" id="saveBtn">${editing? 'Save changes':'Create booking'}</button></div>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  function readForm(){
    return {
      client: document.getElementById('mClient').value.trim(),
      event_name: document.getElementById('mEvent').value.trim(),
      event_type: document.getElementById('mType').value,
      room: document.getElementById('mRoom').value,
      status: document.getElementById('mStatus').value,
      payment_status: document.getElementById('mPay').value,
      start_date: document.getElementById('mStart').value,
      end_date: document.getElementById('mEnd').value || document.getElementById('mStart').value,
      start_time: document.getElementById('mStime').value,
      end_time: document.getElementById('mEtime').value,
      delegates: Number(document.getElementById('mDelegates').value)||0,
      currency: document.getElementById('mCur').value,
      function_rate: Number(document.getElementById('mRate').value)||0,
      accommodation_rate: Number(document.getElementById('mAccRate').value)||0,
      nights: Number(document.getElementById('mNights').value)||0,
      accommodation_delegates: Number(document.getElementById('mAccDel').value)||0,
      notes: document.getElementById('mNotes').value,
    };
  }
  function checkConflicts(){
    const draft = {...readForm(), id: editing? b.id : null};
    const conflicts = findConflicts(draft);
    const box = document.getElementById('conflictBox');
    const cap = roomCap(draft.room);
    let html='';
    if(conflicts.length) html += `<div class="warn-box">Double-booking check: this clashes with ${conflicts.map(c=>esc(c.client||c.event_name)+' ('+c.start_time+'–'+c.end_time+')').join(', ')} in ${esc(draft.room)}.</div>`;
    if(cap && draft.delegates > cap) html += `<div class="warn-box">Delegates (${draft.delegates}) exceed ${esc(draft.room)}'s capacity of ${cap}.</div>`;
    box.innerHTML = html;
  }
  overlay.querySelectorAll('input,select,textarea').forEach(el=> el.addEventListener('input', checkConflicts));
  checkConflicts();

  overlay.querySelector('#closeModal').onclick = ()=>overlay.remove();
  overlay.querySelector('#cancelBtn').onclick = ()=>overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  const delBtn = overlay.querySelector('#deleteBtn');
  if(delBtn) delBtn.onclick = async ()=>{ if(confirm('Delete this booking permanently?')){ await deleteBooking(b.id); overlay.remove(); render(); } };
  overlay.querySelector('#saveBtn').onclick = async ()=>{
    const draft = readForm();
    if(!draft.client){ alert('Please add a client or organisation name.'); return; }
    if(editing){ await updateBooking(b.id, draft); }
    else { draft.created_by = state.currentUser; await insertBooking(draft); }
    overlay.remove();
    render();
  };
}

document.getElementById('newBookingBtn').onclick = ()=>openBookingModal(null);
init();
</script>
</body>
</html>
